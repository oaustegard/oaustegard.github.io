<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="ai-disclosure" content="ai-assisted">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Motion">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Motion Player</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- ===================== Landing screen ===================== -->
  <section id="landing" class="screen">
    <div class="landing-inner">
      <h1 class="brand">Motion Player</h1>
      <p class="tagline">Pan with your hands. Literally.</p>

      <form id="landing-form" autocomplete="off">
        <input
          id="url-input"
          type="text"
          inputmode="url"
          placeholder="Paste a YouTube URL or video ID"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        >
        <button type="submit" id="play-btn" class="btn btn-accent">Play</button>
      </form>

      <p id="landing-error" class="error-slot" role="alert" hidden></p>

      <div id="recents" class="recents" hidden>
        <h2>Recent</h2>
        <ul id="recents-list"></ul>
      </div>

      <p class="install-hint">
        Tip: install this for full-screen play &mdash; iOS: Share&nbsp;&rarr;&nbsp;Add to Home Screen.
        Android/Chrome: &#8942;&nbsp;&rarr;&nbsp;Add to Home screen.
      </p>
    </div>
  </section>

  <!-- ===================== Player screen ===================== -->
  <section id="player" class="screen" hidden>
    <div id="stage">
      <div id="yt-wrapper">
        <div id="yt-host"></div>
      </div>

      <div id="gesture-overlay"></div>

      <button id="unmute-chip" class="chip" type="button" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 15 8.53v6.94A4.5 4.5 0 0 0 16.5 12zM15 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        Tap to unmute
      </button>

      <p id="player-error" class="banner" role="alert" hidden></p>
    </div>

    <!-- Top chrome bar -->
    <div id="chrome-top" class="chrome chrome-top">
      <button id="btn-home" class="icon-btn" type="button" aria-label="Home">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg>
      </button>
      <div class="chrome-spacer"></div>
      <button id="btn-motion" class="icon-btn" type="button" aria-label="Toggle motion control" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z"/></svg>
      </button>
      <button id="btn-recenter" class="icon-btn" type="button" aria-label="Recenter">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 4 4 4 4 0 0 0-4-4zm8.94 3a9 9 0 0 0-7.94-7.94V1h-2v2.06A9 9 0 0 0 3.06 11H1v2h2.06a9 9 0 0 0 7.94 7.94V23h2v-2.06A9 9 0 0 0 20.94 13H23v-2zm-8.94 8a7 7 0 1 1 7-7 7 7 0 0 1-7 7z"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.65 7.65 0 0 0 .06-1 7.65 7.65 0 0 0-.06-1l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.7-1L14.4.5A.5.5 0 0 0 13.9 0h-4a.5.5 0 0 0-.5.5L9 3.03a7.3 7.3 0 0 0-1.7 1l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64L4.44 9a7.65 7.65 0 0 0-.06 1 7.65 7.65 0 0 0 .06 1L2.32 12.65a.5.5 0 0 0-.12.64l2 3.46a.5.5 0 0 0 .61.22l2.49-1a7.3 7.3 0 0 0 1.7 1l.38 2.53a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5l.38-2.53a7.3 7.3 0 0 0 1.7-1l2.49 1a.5.5 0 0 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"/></svg>
      </button>
    </div>

    <!-- Bottom transport bar -->
    <div id="chrome-bottom" class="chrome chrome-bottom">
      <button id="btn-back10" class="icon-btn" type="button" aria-label="Back 10 seconds">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
        <span class="icon-btn-label">10</span>
      </button>
      <button id="btn-playpause" class="icon-btn icon-btn-lg" type="button" aria-label="Play or pause">
        <svg id="icon-play" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" hidden><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button id="btn-fwd10" class="icon-btn" type="button" aria-label="Forward 10 seconds">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg>
        <span class="icon-btn-label">10</span>
      </button>
      <button id="btn-mute" class="icon-btn" type="button" aria-label="Mute or unmute" aria-pressed="true">
        <svg id="icon-vol-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" hidden><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 15 8.53v6.94A4.5 4.5 0 0 0 16.5 12z"/></svg>
        <svg id="icon-vol-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M16.5 12A4.5 4.5 0 0 0 15 8.53v2.79l1.48 1.48c.01-.13.02-.27.02-.4zm2.5 0a6.97 6.97 0 0 1-1.29 4.06l1.15 1.15A8.95 8.95 0 0 0 21 12a8.94 8.94 0 0 0-7-8.77v1.64A7 7 0 0 1 19 12zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.15v1.64a8.96 8.96 0 0 0 3.69-1.9L19.73 21 21 19.73l-9-9L4.27 3zM12 5.27l-1.99 1.99L12 9.25V5.27z"/></svg>
      </button>
    </div>

    <!-- Settings bottom sheet -->
    <div id="settings-sheet" class="sheet" hidden>
      <div class="sheet-handle"></div>
      <h2>Settings</h2>

      <label class="sheet-row">
        <span>Sensitivity</span>
        <input id="setting-sensitivity" type="range" min="0.1" max="2" step="0.1" value="1">
        <span id="setting-sensitivity-val" class="sheet-val">1.0</span>
      </label>

      <label class="sheet-row sheet-row-toggle">
        <span>Vertical pan (pitch)</span>
        <input id="setting-vertical" type="checkbox" checked>
        <span class="switch" aria-hidden="true"></span>
      </label>

      <label class="sheet-row sheet-row-toggle">
        <span>Roll stabilize</span>
        <input id="setting-roll" type="checkbox" checked>
        <span class="switch" aria-hidden="true"></span>
      </label>

      <label class="sheet-row sheet-row-toggle">
        <span>Invert X</span>
        <input id="setting-invert" type="checkbox">
        <span class="switch" aria-hidden="true"></span>
      </label>

      <p id="motion-debug" class="motion-debug">no motion events</p>

      <button id="settings-close" class="btn" type="button">Done</button>
    </div>
    <div id="settings-scrim" class="scrim" hidden></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
