<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="ai-disclosure" content="ai-generated">
<meta name="description" content="Ann Arbor and 10 miles around it on one zoomable map: tax parcels, zoning, historic districts, flood zones, school districts and municipalities from public GIS services, with for-sale listings from your own RentCast key and links out to the portals.">
<title>Ann Arbor Real Estate</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<script src="https://cdn.jsdelivr.net/npm/openseadragon@6.1.1/build/openseadragon/openseadragon.min.js"></script>
<style>
:root{--bg:#eef0f2;--ink:#1f2630;--muted:#646d78;--line:#c5ccd3;--accent:#00274c;--gold:#c99700;--hl:#d9480f;
  --panel:rgba(247,248,250,.95);--shadow:0 4px 18px rgba(0,0,0,.18);--fade:#eef0f2;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--ink:#e3e8ee;--muted:#98a2ad;
  --line:#343c46;--accent:#ffcb05;--gold:#ffcb05;--hl:#ff7a3d;--panel:rgba(22,27,34,.94);--fade:#12161c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--ink:#e3e8ee;--muted:#98a2ad;--line:#343c46;--accent:#ffcb05;--gold:#ffcb05;--hl:#ff7a3d;
  --panel:rgba(22,27,34,.94);--fade:#12161c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#map{position:absolute;inset:0;background:#e2e5e8}
@media (prefers-color-scheme:dark){#map{background:#1b2027}}
#map.paper{background:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
button,input,select{font:inherit;color:inherit}

/* search */
#top{position:absolute;left:12px;top:12px;z-index:30;width:min(400px,calc(100vw - 80px))}
#bar{display:flex;align-items:center;gap:8px;padding:6px 10px}
#top h1{font-size:13px;font-weight:600;margin:0;white-space:nowrap}
#top h1 a{color:inherit;text-decoration:none}
#q{flex:1;min-width:0;border:0;background:transparent;padding:6px 2px;outline:none;font-size:15px}
#results{list-style:none;margin:6px 0 0;padding:4px;max-height:50vh;overflow:auto;display:none}
#results.open{display:block}
#results li{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
#results li[aria-selected="true"],#results li:hover{background:color-mix(in srgb,var(--gold) 22%,transparent)}
#results .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;min-width:58px}
#results .s{color:var(--muted);font-size:12px;margin-left:auto;text-align:right}
#results .msg{color:var(--muted);cursor:default}

/* layers */
#layers{position:absolute;right:12px;top:12px;z-index:25;width:270px;padding:10px 12px;max-height:calc(100% - 240px);overflow:auto}
#layers h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:2px 0 6px;font-weight:600}
#layers h2+div{margin-bottom:10px}
#layers label{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer}
#layers input[type=radio],#layers input[type=checkbox],#layers input[type=range]{accent-color:var(--accent)}
#layers input[type=range]{width:100%;margin:2px 0 4px}
#layers .note{font-size:11px;color:var(--muted);margin-left:auto;text-align:right}
#layers .hint{font-size:12px;color:var(--muted);margin:2px 0 6px}
#layers .row{display:flex;gap:6px;align-items:center;margin:4px 0}
#layers .row input[type=text],#layers .row input[type=password],#layers .row input[type=number]{flex:1;min-width:0;border:1px solid var(--line);
  background:transparent;border-radius:5px;padding:3px 6px;font-size:12px}
#layers .btn{border:1px solid var(--line);background:none;border-radius:5px;padding:3px 8px;cursor:pointer;font-size:12px;white-space:nowrap}
#layers .btn:hover{border-color:var(--accent)}
#layers .links a{color:var(--accent);font-size:12px;margin-right:8px;white-space:nowrap}
#layersToggle{display:none}
#layers .x{display:none}

/* property card */
#info{position:absolute;left:12px;bottom:34px;z-index:25;width:min(380px,calc(100vw - 24px));padding:12px 14px;display:none;
  max-height:calc(100vh - 140px);overflow:auto}
#info.open{display:block}
#info h2{margin:0 26px 2px 0;font-size:18px}
#info h3{margin:10px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
#info .sub{color:var(--muted);margin-bottom:8px}
#info dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 6px}
#info dt{color:var(--muted)}
#info dd{margin:0}
#info a{color:var(--accent)}
#info .close{position:absolute;right:8px;top:6px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
#info .links a{margin-right:10px;white-space:nowrap}
#info .warn{color:var(--hl)}

/* controls */
#ctrl{position:absolute;right:12px;bottom:34px;z-index:20;display:flex;flex-direction:column;gap:6px}
#ctrl button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;
  font-size:18px;line-height:1;box-shadow:var(--shadow)}
#ctrl button:hover,#ctrl button:focus-visible{border-color:var(--accent);outline:none}

/* status line */
#foot{position:absolute;left:0;right:0;bottom:0;z-index:15;display:flex;gap:12px;align-items:center;
  padding:3px 10px;font-size:11px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line)}
#attrib{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#attrib a{color:inherit}
#scale{display:flex;align-items:center;gap:6px}
#scale i{display:block;height:6px;border:1.5px solid var(--ink);border-top:0}
#coords{font-variant-numeric:tabular-nums;white-space:nowrap}

/* 10-mile fade, highlight and listing pins (SVG over the OSD canvas, redrawn every frame) */
#fade,#hl{position:absolute;inset:0;pointer-events:none;overflow:visible;width:100%;height:100%}
#fade{z-index:4}
#fade .city{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;fill-rule:evenodd;vector-effect:non-scaling-stroke}
#fade .ring{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 6;opacity:.7}
#hl{z-index:5}
#hl path{fill:color-mix(in srgb,var(--hl) 16%,transparent);stroke:var(--hl);stroke-width:3;stroke-linejoin:round;fill-rule:evenodd;vector-effect:non-scaling-stroke}
#hl circle.pin{fill:var(--hl);stroke:#fff;stroke-width:2}
#hl g.ls{pointer-events:auto;cursor:pointer}
#hl g.ls circle{fill:var(--accent);stroke:#fff;stroke-width:1.5}
#hl g.ls.sel circle{fill:var(--hl)}
#hl path.auc{pointer-events:auto;cursor:pointer;fill:color-mix(in srgb,#7b3fa0 30%,transparent);stroke:#7b3fa0;stroke-width:2}
#hl path.auc.sel{stroke:var(--hl);stroke-width:3}
#hl g.ls text{font-size:11px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px}

@media (max-width:640px){
  #top{width:calc(100vw - 70px)}
  #top h1{display:none}
  #layersToggle{display:block;position:absolute;right:12px;top:12px;z-index:26;width:44px;height:44px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel);font-size:20px;box-shadow:var(--shadow);cursor:pointer}
  #layers{display:none;top:64px;width:calc(100vw - 24px);max-height:calc(100% - 100px)}
  #layers.open{display:block}
  #layers .x{display:block;position:absolute;right:8px;top:4px;border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer}
  #info{bottom:28px;max-height:45vh}
  #ctrl{bottom:auto;top:70px}
  #info.open~#ctrl{display:none}
  #coords{display:none}
}
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>
<svg id="fade" aria-hidden="true"><defs><radialGradient id="fg" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1">
  <stop offset="0" stop-color="var(--fade)" stop-opacity="0"/><stop offset=".78" stop-color="var(--fade)" stop-opacity="0"/>
  <stop offset=".86" stop-color="var(--fade)" stop-opacity=".45"/><stop offset="1" stop-color="var(--fade)" stop-opacity=".88"/>
</radialGradient></defs><rect x="-50%" y="-50%" width="200%" height="200%" fill="url(#fg)"/><g class="geo"><path class="city"/></g><path class="ring"/></svg>
<svg id="hl" aria-hidden="true"><g class="geo"><g class="aucs"></g><g class="shapes"></g></g><g class="pts"></g></svg>

<div id="top">
  <div id="bar" class="card">
    <h1><a href="/deepzoom/" title="Deep Zoom index">Ann Arbor Real Estate</a></h1>
    <!-- Safari offers contact AutoFill on any field that mentions an address, whatever autocomplete says. -->
    <input id="q" name="map-search" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
      enterkeyhint="search" placeholder="Street, place, or parcel no." aria-label="Search streets, places or parcel numbers"
      role="combobox" aria-controls="results" aria-expanded="false">
  </div>
  <ul id="results" class="card" role="listbox"></ul>
</div>

<button id="layersToggle" aria-controls="layers" aria-expanded="false" title="Layers">&#9776;</button>
<div id="layers" class="card">
  <button class="x" aria-label="Close layers">&times;</button>
  <h2>Base map</h2>
  <div id="bases"></div>
  <h2>On top of the base map</h2>
  <div id="mix"></div>
  <h2>Records</h2>
  <div id="records"></div>
  <h2>Environment and safety</h2>
  <div id="env"></div>
  <h2>Boundaries</h2>
  <div id="bounds"></div>
  <p class="hint" id="zoomHint"></p>
  <h2>Listings</h2>
  <div id="listings">
    <label><input type="checkbox" id="aucOn">Tax-foreclosure auction <span class="note">Washtenaw County</span></label>
    <p class="hint" id="aucMsg" hidden></p>
    <label><input type="checkbox" id="lsOn">For sale <span class="note">RentCast, your key</span></label>
    <div id="lsBox" hidden>
      <div class="row"><input type="password" id="lsKey" placeholder="RentCast API key" autocomplete="off" aria-label="RentCast API key"></div>
      <div class="row"><input type="number" id="lsMin" placeholder="Min $" step="25000" min="0" aria-label="Minimum price">
        <input type="number" id="lsMax" placeholder="Max $" step="25000" min="0" aria-label="Maximum price"></div>
      <div class="row"><button class="btn" id="lsLoad">Load listings in view</button><span class="note" id="lsMsg"></span></div>
      <p class="hint">The key stays in this browser. RentCast's free plan allows 50 requests a month, so listings load only when you ask.</p>
    </div>
    <div class="links" id="portalLinks"></div>
  </div>
</div>

<div id="info" class="card" aria-live="polite"></div>

<div id="ctrl">
  <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
  <button id="zout" title="Zoom out" aria-label="Zoom out">&minus;</button>
  <button id="locate" title="Go to my location" aria-label="Go to my location">&#9678;</button>
  <button id="home" title="Whole area" aria-label="Show the whole 10-mile area">&#8962;</button>
</div>

<div id="foot">
  <div id="attrib"></div>
  <div id="scale"><i></i><span></span></div>
  <div id="coords"></div>
</div>

<script>
(() => {
  const OSD = OpenSeadragon;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} } };

  // ── Web Mercator ↔ OpenSeadragon viewport ───────────────────────────────
  // Every layer is one square TiledImage of width 1 covering the whole Mercator world,
  // so a viewport point is just a normalised Mercator coordinate (y down).
  const R = 6378137, HALF = Math.PI * R, CIRC = 2 * HALF;
  const toVp = (lon, lat) => {
    const x = R * lon * Math.PI / 180, y = R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
    return new OSD.Point((x + HALF) / CIRC, (HALF - y) / CIRC);
  };
  const fromVp = (p) => [(p.x * CIRC - HALF) / R * 180 / Math.PI,
    (2 * Math.atan(Math.exp((HALF - p.y * CIRC) / R)) - Math.PI / 2) * 180 / Math.PI];

  // ── the area: 10 miles around Main and Liberty ─────────────────────────
  const CENTER = [-83.7483, 42.2808], MILES = 10, RADIUS_M = MILES * 1609.344;
  const C_VP = toVp(...CENTER);
  const R_VP = RADIUS_M / Math.cos(CENTER[1] * Math.PI / 180) / CIRC;   // Mercator stretch at this latitude
  const deg = RADIUS_M / 111320;
  const AREA = [CENTER[0] - deg / Math.cos(CENTER[1] * Math.PI / 180), CENTER[1] - deg,
    CENTER[0] + deg / Math.cos(CENTER[1] * Math.PI / 180), CENTER[1] + deg];
  const milesFrom = (lon, lat) => {
    const k = Math.PI / 180, a = Math.sin((lat - CENTER[1]) * k / 2) ** 2 +
      Math.cos(lat * k) * Math.cos(CENTER[1] * k) * Math.sin((lon - CENTER[0]) * k / 2) ** 2;
    return 2 * 6371008.8 * Math.asin(Math.sqrt(a)) / 1609.344;
  };

  // ── tile sources ────────────────────────────────────────────────────────
  // XYZ sources are 256 px tiles: OSD level L shows the world at 2^L px, so slippy-map zoom z = L - 8.
  // ArcGIS export requests are 512 px tiles over the same pyramid: level L, 2^(L-9) tiles across.
  const xyz = (maxZ, url) => new OSD.TileSource({
    width: 256 * 2 ** maxZ, height: 256 * 2 ** maxZ, tileSize: 256, tileOverlap: 0, minLevel: 8, maxLevel: 8 + maxZ,
    getTileUrl: (L, x, y) => url(L - 8, x, y),
  });
  const bboxOf = (L, x, y) => {
    const s = CIRC / 2 ** (L - 9), x0 = -HALF + x * s, y1 = HALF - y * s;
    return { s, bbox: `${x0.toFixed(2)},${(y1 - s).toFixed(2)},${(x0 + s).toFixed(2)},${y1.toFixed(2)}` };
  };
  // A MapServer layer with a minScale draws nothing when zoomed out past it. Asking for a lower dpi
  // lowers the scale the server computes for the same tile, so the layer appears a few zoom levels earlier.
  const arcgis = (svc, layers, { minZ = 8, maxZ = 21, minScale = 0 } = {}) => new OSD.TileSource({
    width: 2 ** (8 + maxZ), height: 2 ** (8 + maxZ), tileSize: 512, tileOverlap: 0, minLevel: 8 + Math.max(minZ, 1), maxLevel: 8 + maxZ,
    getTileUrl(L, x, y) {
      const { s, bbox } = bboxOf(L, x, y);
      const dpi = minScale ? Math.max(12, Math.min(96, Math.floor(minScale * 0.85 * 0.0254 * 512 / s))) : 96;
      return `${svc}/export?bbox=${bbox}&bboxSR=3857&imageSR=3857&size=512,512&dpi=${dpi}` +
        `&format=png32&transparent=true&layers=show:${layers}&f=image`;
    },
  });
  const arcImage = (svc, rule, { minZ = 8, maxZ = 18 } = {}) => new OSD.TileSource({
    width: 2 ** (8 + maxZ), height: 2 ** (8 + maxZ), tileSize: 512, tileOverlap: 0, minLevel: 8 + minZ, maxLevel: 8 + maxZ,
    getTileUrl(L, x, y) {
      return `${svc}/exportImage?bbox=${bboxOf(L, x, y).bbox}&bboxSR=3857&imageSR=3857&size=512,512&format=png` +
        `&renderingRule=${encodeURIComponent(JSON.stringify({ rasterFunction: rule }))}&f=image`;
    },
  });

  // ── services ────────────────────────────────────────────────────────────
  const A2 = "https://a2mapseg.a2gov.org/a2arcgis/rest/services/Energov/AnnArborEnerGov/MapServer";
  const FEMA = "https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer";
  const MIGF = "https://gisagocss.state.mi.us/arcgis/rest/services/OpenData/michigan_geographic_framework/MapServer";
  const DEP = "https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer";
  const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services";
  const USGS = "https://basemap.nationalmap.gov/arcgis/rest/services";
  const A2MAPS = "https://a2maps.a2gov.org/a2arcgis/rest/services";
  const EGLE = "https://gisagoegle.state.mi.us/arcgis/rest/services/EGLE/RRDOpenData/MapServer";
  const NWI = "https://fwspublicservices.wim.usgs.gov/wetlandsmapservice/rest/services/Wetlands/MapServer";
  const CONTOURS = "https://carto.nationalmap.gov/arcgis/rest/services/contours/MapServer";
  const NOISE = "https://geo.dot.gov/server/rest/services/Hosted/NTAD_Noise_2020_CONUS_Aviation_Road/MapServer";
  const AUCTION = "https://services2.arcgis.com/xRI3cTw3hPVoEJP0/arcgis/rest/services/2026_Auction_Parcels/FeatureServer/0";
  const A2_ATTR = "<a href='https://www.a2gov.org/'>City of Ann Arbor</a> GIS";

  const BASES = [
    { id: "osm", name: "Street", note: "OpenStreetMap", attr: "© <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors, ODbL",
      src: () => xyz(19, (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`) },
    { id: "grey", name: "Light grey", note: "Esri", attr: "Base map Esri, HERE, Garmin, © OpenStreetMap contributors",
      src: () => xyz(16, (z, x, y) => `${ESRI}/Canvas/World_Light_Gray_Base/MapServer/tile/${z}/${y}/${x}`) },
    { id: "topo", name: "Topographic", note: "USGS", attr: "<a href='https://www.usgs.gov/programs/national-geospatial-program/national-map'>USGS The National Map</a>",
      src: () => xyz(16, (z, x, y) => `${USGS}/USGSTopo/MapServer/tile/${z}/${y}/${x}`) },
    { id: "air", name: "Aerial", note: "Esri World Imagery",
      attr: "Aerial imagery <a href='https://www.arcgis.com/home/item.html?id=10df2279f9684e4a9f6a7f08febac2a9'>Esri World Imagery</a>: Esri, Vantor, Earthstar Geographics",
      src: () => xyz(19, (z, x, y) => `${ESRI}/World_Imagery/MapServer/tile/${z}/${y}/${x}`) },
    { id: "mi", name: "Aerial, Michigan", note: "State of Michigan", attr: "Aerial imagery <a href='https://imagery.michigan.gov/'>State of Michigan</a>",
      src: () => xyz(19, (z, x, y) => `https://imagery.michigan.gov/server/rest/services/Michigan_imagery_public/MapServer/tile/${z}/${y}/${x}`) },
    { id: "bike", name: "Cycling", note: "CyclOSM", attr: "<a href='https://www.cyclosm.org/'>CyclOSM</a>, © <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors, ODbL",
      src: () => xyz(20, (z, x, y) => `https://${"abc"[(x + y) % 3]}.tile-cyclosm.openstreetmap.fr/cyclosm/${z}/${x}/${y}.png`) },
    { id: "none", name: "None", note: "relief only", attr: null, src: null },
  ];
  // Stack order, bottom up; the panel groups them by `group`.
  // minZ: below this the layer is hidden (and not fetched). `city` marks layers that cover Ann Arbor only.
  const OVERLAYS = [
    // Imagery as see-through layers, so an aerial can sit over the street map or the street map's roads over an aerial.
    { id: "e", group: "mix", name: "Aerial, Esri", on: false, opacity: .6, minZ: 8, attr: "Aerial imagery Esri, Vantor, Earthstar Geographics",
      src: () => xyz(19, (z, x, y) => `${ESRI}/World_Imagery/MapServer/tile/${z}/${y}/${x}`) },
    { id: "i", group: "mix", name: "Aerial, Michigan", on: false, opacity: .6, minZ: 8, attr: "Aerial imagery <a href='https://imagery.michigan.gov/'>State of Michigan</a>",
      src: () => xyz(19, (z, x, y) => `https://imagery.michigan.gov/server/rest/services/Michigan_imagery_public/MapServer/tile/${z}/${y}/${x}`) },
    { id: "t", group: "mix", name: "Terrain", note: "USGS 3DEP lidar", on: false, opacity: .5, minZ: 8, blend: "multiply",
      attr: "Hillshade <a href='https://www.usgs.gov/3d-elevation-program'>USGS 3DEP</a>", src: () => arcImage(DEP, "Hillshade Gray") },
    { id: "u", group: "records", name: "Land use", note: "city", city: true, on: false, opacity: .55, minZ: 13, attr: A2_ATTR,
      src: () => arcgis(A2, 20, { minZ: 12 }) },
    { id: "q", group: "env", name: "Road and aircraft noise", note: "US DOT, 2020", on: false, opacity: .5, minZ: 8,
      attr: "Noise <a href='https://www.bts.gov/geospatial/national-transportation-noise-map'>US DOT BTS</a>",
      src: () => xyz(16, (z, x, y) => `${NOISE}/tile/${z}/${y}/${x}`) },
    { id: "g", group: "env", name: "Parks and preserved land", note: "Greenbelt map", on: false, opacity: .45, minZ: 9, attr: A2_ATTR,
      src: () => arcgis(`${A2MAPS}/Greenbelt/MapServer`, "3,5", { minZ: 8 }) },
    { id: "w", group: "env", name: "Wetlands", note: "US Fish & Wildlife", on: false, opacity: .6, minZ: 11,
      attr: "Wetlands <a href='https://www.fws.gov/program/national-wetlands-inventory'>USFWS NWI</a>", src: () => arcgis(NWI, 0, { minZ: 10, minScale: 250000 }) },
    { id: "z", group: "records", name: "Zoning", note: "city", city: true, on: true, opacity: .55, minZ: 12, attr: A2_ATTR,
      src: () => arcgis(A2, 19, { minZ: 11, minScale: 10000 }) },
    { id: "f", group: "records", name: "Flood zones", note: "FEMA", on: false, opacity: .6, minZ: 11, attr: "<a href='https://www.fema.gov/flood-maps/national-flood-hazard-layer'>FEMA NFHL</a>",
      src: () => arcgis(FEMA, 28, { minZ: 10 }) },
    { id: "h", group: "records", name: "Historic districts", note: "city", city: true, on: false, opacity: .7, minZ: 12, attr: A2_ATTR,
      src: () => arcgis(A2, 18, { minZ: 11 }) },
    { id: "d", group: "records", name: "Downtown (DDA)", note: "city", city: true, on: false, opacity: .5, minZ: 12, attr: A2_ATTR,
      src: () => arcgis(A2, 12, { minZ: 11, minScale: 10000 }) },
    { id: "a", group: "records", name: "Easements", note: "city", city: true, on: false, opacity: .7, minZ: 15, attr: A2_ATTR,
      src: () => arcgis(A2, 16, { minZ: 14, minScale: 4801 }) },
    { id: "j", group: "records", name: "Development projects", note: "city", city: true, on: false, opacity: .6, minZ: 12, attr: A2_ATTR,
      src: () => arcgis(A2, 40, { minZ: 11 }) },
    { id: "k", group: "records", name: "Rental properties", note: "city", city: true, on: false, opacity: .6, minZ: 13, attr: A2_ATTR,
      src: () => arcgis(A2, 43, { minZ: 12 }) },
    { id: "p", group: "records", name: "Tax parcels", note: "city", city: true, on: true, opacity: 1, minZ: 15, attr: A2_ATTR,
      src: () => arcgis(A2, 13, { minZ: 14, minScale: 4801 }) },
    { id: "l", group: "records", name: "Water service lines", note: "city", city: true, on: false, opacity: 1, minZ: 16, attr: A2_ATTR,
      src: () => arcgis(`${A2MAPS}/WaterServiceLeadMaterialAll/MapServer`, "0", { minZ: 15, minScale: 3000 }) },
    { id: "o", group: "env", name: "Contours", note: "USGS", on: false, opacity: .8, minZ: 13,
      attr: "Contours <a href='https://www.usgs.gov/programs/national-geospatial-program/national-map'>USGS</a>", src: () => arcgis(CONTOURS, 19, { minZ: 12, minScale: 50000 }) },
    { id: "y", group: "env", name: "Traffic crashes", note: "city", city: true, on: false, opacity: .8, minZ: 14, attr: A2_ATTR,
      src: () => arcgis(`${A2MAPS}/RoadsSpeedlimitCrash/MapServer`, "0", { minZ: 13 }) },
    { id: "x", group: "env", name: "Contamination and storage tanks", note: "Michigan EGLE", on: false, opacity: 1, minZ: 11,
      attr: "Sites <a href='https://www.michigan.gov/egle'>Michigan EGLE</a>", src: () => arcgis(EGLE, "0,1,3,5", { minZ: 10 }) },
    { id: "s", group: "bounds", name: "School districts", note: "Michigan", on: false, opacity: .8, minZ: 8, attr: "<a href='https://gis-michigan.opendata.arcgis.com/'>State of Michigan</a>",
      src: () => arcgis(MIGF, 10) },
    // Drawn by the page as an SVG line (no tiles), so it stays crisp at every zoom.
    { id: "c", group: "bounds", name: "Ann Arbor city limits", note: "Michigan", on: true, opacity: .9, minZ: 0, vector: true,
      attr: "<a href='https://gis-michigan.opendata.arcgis.com/'>State of Michigan</a>" },
    { id: "m", group: "bounds", name: "Cities and townships", note: "Michigan", on: true, opacity: .8, minZ: 8, attr: "<a href='https://gis-michigan.opendata.arcgis.com/'>State of Michigan</a>",
      src: () => arcgis(MIGF, 2) },
    { id: "r", group: "mix", name: "Roads", note: "Esri", on: false, opacity: 1, minZ: 8, attr: "Roads and labels Esri, HERE, Garmin, © OpenStreetMap contributors",
      src: () => xyz(19, (z, x, y) => `${ESRI}/Reference/World_Transportation/MapServer/tile/${z}/${y}/${x}`) },
    { id: "n", group: "mix", name: "Place names", note: "Esri", on: false, opacity: 1, minZ: 8, attr: "Roads and labels Esri, HERE, Garmin, © OpenStreetMap contributors",
      src: () => xyz(19, (z, x, y) => `${ESRI}/Reference/World_Boundaries_and_Places/MapServer/tile/${z}/${y}/${x}`) },
  ];
  const ALL = [...BASES, ...OVERLAYS];

  // ── state from the URL hash: #z/lat/lon/base/overlays ─────────────────
  const state = { base: "osm", on: new Set(OVERLAYS.filter((o) => o.on).map((o) => o.id)), view: null };
  function readHash() {
    const h = location.hash.slice(1).split("/");
    state.view = h.length >= 3 && h.slice(0, 3).every((v) => isFinite(parseFloat(v))) ? h.slice(0, 3).map(Number) : null;
    if (h[3] && BASES.some((b) => b.id === h[3])) state.base = h[3];
    if (h.length >= 5) state.on = new Set(h[4].split("").filter((c) => OVERLAYS.some((o) => o.id === c)));
  }
  readHash();

  // ── viewer ──────────────────────────────────────────────────────────────
  // The canvas drawer with crossOriginPolicy false takes tiles from any server, CORS headers or not;
  // only the click and search lookups (fetch) need CORS.
  const viewer = OSD({
    element: $("map"),
    drawer: "canvas",
    crossOriginPolicy: false,
    showNavigationControl: false,
    preserveViewport: true,
    visibilityRatio: 0.2,
    constrainDuringPan: false,
    wrapHorizontal: false,
    maxZoomPixelRatio: Infinity,
    zoomPerScroll: 1.5,
    zoomPerClick: 2,
    animationTime: 0.7,
    springStiffness: 8,
    blendTime: 0.15,
    imageLoaderLimit: 12,
    maxImageCacheCount: 200,
    tileRetryMax: 1,
    tileRetryDelay: 1000,
    gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true, flickEnabled: true, scrollToZoom: true },
    gestureSettingsTouch: { clickToZoom: false, dblClickToZoom: true, pinchToZoom: true, flickEnabled: true },
    gestureSettingsPen: { clickToZoom: false, dblClickToZoom: true },
  });
  const vp = () => viewer.viewport;
  const MAX_Z = 21;
  const zoomFor = (z) => 256 * 2 ** z / vp().getContainerSize().x;
  const displayZ = (current = true) => Math.log2(vp().getZoom(current) * vp().getContainerSize().x / 256);
  // Zooming out stops when the 10-mile circle, with its fade, fills the shorter side of the window.
  const clampZoom = () => {
    const s = vp().getContainerSize();
    vp().maxZoomLevel = zoomFor(MAX_Z);
    vp().minZoomLevel = Math.min(s.x, s.y) / s.x / (3.2 * R_VP);
  };

  function setView(lon, lat, z, immediately = false) {
    vp().zoomTo(Math.max(zoomFor(Math.min(z, MAX_Z)), vp().minZoomLevel || 0), null, immediately);
    vp().panTo(toVp(lon, lat), immediately);
  }
  // Computed here rather than with viewport.fitBounds, which loses the centre when the zoom is clamped.
  function fitLonLat(w, s, e, n, maxZ = 19, immediately = false) {
    const a = toVp(w, n), b = toVp(e, s), size = vp().getContainerSize();
    const worldPx = Math.min(size.x / Math.max(b.x - a.x, 1e-12), size.y / Math.max(b.y - a.y, 1e-12)) * 0.8;
    const c = fromVp(new OSD.Point((a.x + b.x) / 2, (a.y + b.y) / 2));
    setView(c[0], c[1], Math.min(Math.log2(worldPx / 256), maxZ), immediately);
  }
  const home = (immediately) => fitLonLat(...AREA, 19, immediately);

  // Panning is free, but a view whose centre ends up outside the circle springs back to its edge.
  function keepInside() {
    const c = vp().getCenter(false), dx = c.x - C_VP.x, dy = c.y - C_VP.y, d = Math.hypot(dx, dy);
    if (d > R_VP * 1.05) vp().panTo(new OSD.Point(C_VP.x + dx * R_VP / d, C_VP.y + dy * R_VP / d));
  }

  // Tiled images are created on first use. An item at opacity 0 fetches nothing, so hidden layers cost no requests.
  const items = new Map();
  function ensureItem(layer) {
    if (items.has(layer.id)) return items.get(layer.id);
    if (!layer.src) return Promise.resolve(null);
    const p = new Promise((resolve) => viewer.addTiledImage({
      tileSource: layer.src(), x: 0, y: 0, width: 1, opacity: 0,
      compositeOperation: layer.blend || null,
      success: (e) => resolve(e.item),
      error: () => resolve(null),
    }));
    items.set(layer.id, p);
    return p;
  }

  async function applyLayers() {
    for (const b of BASES) {
      if (b.id !== state.base && !items.has(b.id)) continue;
      const it = await ensureItem(b);
      if (it) it.setOpacity(b.id === state.base ? 1 : 0);
    }
    const z = displayZ();
    for (const o of OVERLAYS) {
      if (!state.on.has(o.id) && !items.has(o.id)) continue;
      const it = await ensureItem(o);
      if (it) it.setOpacity(state.on.has(o.id) && z >= o.minZ ? o.opacity : 0);
    }
    let i = 0;
    for (const l of ALL) {
      if (!items.has(l.id)) continue;
      const it = await items.get(l.id);
      if (!it) continue;
      if (viewer.world.getIndexOfItem(it) !== i) viewer.world.setItemIndex(it, i);
      i++;
    }
    if (state.on.has("c")) loadCity();
    drawCity();
    $("map").classList.toggle("paper", state.base === "none");
    const waiting = OVERLAYS.filter((o) => state.on.has(o.id) && z < o.minZ).map((o) => o.name.toLowerCase());
    $("zoomHint").textContent = waiting.length ? `Zoom in to see ${waiting.join(", ")}.` : "";
    attribution();
    saveHash();
  }

  // Overlay visibility follows zoom; only touch OSD when a threshold is crossed. Checked every
  // frame, because OSD's "zoom" event fires once when an animation starts, not as it progresses.
  let lastBand = null;
  function checkBands() {
    const z = displayZ();
    const band = OVERLAYS.map((o) => z >= o.minZ).join();
    if (band !== lastBand) { lastBand = band; applyLayers(); }
  }

  function attribution() {
    const parts = [BASES.find((b) => b.id === state.base).attr].filter(Boolean);
    const z = displayZ();
    for (const o of OVERLAYS) if (state.on.has(o.id) && z >= o.minZ && !parts.includes(o.attr)) parts.push(o.attr);
    if (auction.length) parts.push("Auction parcels <a href='https://www.washtenaw.org/'>Washtenaw County</a>");
    if (listings.length) parts.push("Listings <a href='https://www.rentcast.io/'>RentCast</a>");
    parts.push("Search <a href='https://www.esri.com/'>Esri</a>");
    $("attrib").innerHTML = parts.join(" · ");
  }

  // ── layer panel ─────────────────────────────────────────────────────────
  $("bases").innerHTML = BASES.map((b) => `<label><input type="radio" name="base" value="${b.id}"${b.id === state.base ? " checked" : ""}>` +
    `${esc(b.name)}<span class="note">${esc(b.note)}</span></label>`).join("");
  const toggles = (group) => OVERLAYS.filter((o) => o.group === group).map((o) =>
    `<label><input type="checkbox" value="${o.id}"${state.on.has(o.id) ? " checked" : ""}>${esc(o.name)}` +
    `${o.note ? `<span class="note">${esc(o.note)}</span>` : ""}</label>` +
    `<input type="range" min="0.1" max="1" step="0.05" value="${o.opacity}" data-o="${o.id}" aria-label="${esc(o.name)} opacity"` +
    `${state.on.has(o.id) ? "" : " hidden"}>`).join("");
  for (const g of ["mix", "records", "env", "bounds"]) $(g).innerHTML = toggles(g);
  $("bases").addEventListener("change", (e) => { state.base = e.target.value; applyLayers(); });
  for (const box of [$("mix"), $("records"), $("env"), $("bounds")]) {
    box.addEventListener("change", (e) => {
      if (e.target.type !== "checkbox") return;
      const id = e.target.value;
      e.target.checked ? state.on.add(id) : state.on.delete(id);
      document.querySelector(`[data-o="${id}"]`).hidden = !e.target.checked;
      applyLayers();
    });
    box.addEventListener("input", (e) => {
      const o = OVERLAYS.find((x) => x.id === e.target.dataset.o);
      if (!o) return;
      o.opacity = +e.target.value;
      applyLayers();
    });
  }
  const layersPanel = (open) => { $("layers").classList.toggle("open", open); $("layersToggle").setAttribute("aria-expanded", open); };
  $("layersToggle").onclick = () => layersPanel(!$("layers").classList.contains("open"));
  document.querySelector("#layers .x").onclick = () => layersPanel(false);

  // ── controls, hash, scale, coordinates ─────────────────────────────────
  $("zin").onclick = () => vp().zoomBy(2);
  $("zout").onclick = () => vp().zoomBy(0.5);
  $("home").onclick = () => home(false);
  $("locate").onclick = () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition((p) => {
      const { longitude: lon, latitude: lat } = p.coords;
      if (milesFrom(lon, lat) > MILES) { showInfo(`<p>You are ${Math.round(milesFrom(lon, lat))} miles from Ann Arbor, outside the map.</p>`); return; }
      setView(lon, lat, 17); pin = [lon, lat]; drawOverlay();
    }, (err) => showInfo(`<p>Location unavailable: ${esc(err.message)}</p>`), { enableHighAccuracy: true, timeout: 10000 });
  };

  let hashTimer = 0;
  function saveHash() {
    clearTimeout(hashTimer);
    hashTimer = setTimeout(() => {
      if (!viewer.world.getItemCount()) return;
      const [lon, lat] = fromVp(vp().getCenter(false));
      const h = `#${displayZ(false).toFixed(2)}/${lat.toFixed(5)}/${lon.toFixed(5)}/${state.base}/${[...state.on].join("")}`;
      if (h !== location.hash) history.replaceState(null, "", h);
      portalLinks();
    }, 300);
  }
  viewer.addHandler("animation-finish", () => { keepInside(); saveHash(); });

  function scaleBar() {
    const [, lat] = fromVp(vp().getCenter(true));
    const mpp = CIRC * Math.cos(lat * Math.PI / 180) / (256 * 2 ** displayZ());
    const fpp = mpp * 3.28084, target = fpp * 100;
    // Feet up to half a mile, miles beyond.
    const units = target < 2640 ? [1, "ft", fpp] : [5280, "mi", fpp];
    const t = target / units[0], pow = 10 ** Math.floor(Math.log10(t));
    const nice = [1, 2, 5, 10].map((k) => k * pow).filter((v) => v <= t).pop();
    $("scale").querySelector("i").style.width = `${Math.round(nice * units[0] / fpp)}px`;
    $("scale").querySelector("span").textContent = `${nice} ${units[1]}`;
  }
  viewer.addHandler("update-viewport", () => { checkBands(); scaleBar(); drawFade(); placeOverlay(); });
  viewer.addHandler("resize", clampZoom);

  const fmt = (v, pos, neg) => `${Math.abs(v).toFixed(5)}°${v >= 0 ? pos : neg}`;
  viewer.element.addEventListener("pointermove", (e) => {
    if (!viewer.world.getItemCount()) return;
    const r = viewer.element.getBoundingClientRect();
    const [lon, lat] = fromVp(vp().viewerElementToViewportCoordinates(new OSD.Point(e.clientX - r.left, e.clientY - r.top)));
    $("coords").textContent = `${fmt(lat, "N", "S")} ${fmt(lon, "E", "W")} · ${milesFrom(lon, lat).toFixed(1)} mi · z${displayZ().toFixed(1)}`;
  });

  // ── the fade: transparent inside 10 miles, background colour beyond ────
  function drawFade() {
    const c = vp().pixelFromPoint(C_VP, true);
    const r = vp().deltaPixelsFromPoints(new OSD.Point(R_VP, 0), true).x;
    const g = $("fg");
    g.setAttribute("cx", c.x); g.setAttribute("cy", c.y); g.setAttribute("r", r / 0.86);
    document.querySelector("#fade .ring").setAttribute("d", ringPath(c, r));
    document.querySelector("#fade .geo").setAttribute("transform", geoTransform());
  }

  // The dashed edge of the circle. Zoomed in, a whole dashed circle is hundreds of thousands of pixels
  // round and costs a frame of its own, so only the arc that crosses the window is drawn.
  function ringPath(c, r) {
    const { x: w, y: h } = vp().getContainerSize(), m = 20;
    if (r < 2 * Math.hypot(w, h)) return `M${c.x - r},${c.y}a${r},${r} 0 1 0 ${2 * r},0a${r},${r} 0 1 0 ${-2 * r},0`;
    const corners = [[-m, -m], [w + m, -m], [w + m, h + m], [-m, h + m]];
    const far = Math.max(...corners.map(([x, y]) => Math.hypot(x - c.x, y - c.y)));
    const near = Math.hypot(Math.max(-m - c.x, 0, c.x - w - m), Math.max(-m - c.y, 0, c.y - h - m));
    if (far < r || near > r) return "";
    // The centre is far off-screen here, so the window spans less than half a turn as seen from it.
    const mid = Math.atan2(h / 2 - c.y, w / 2 - c.x);
    const rel = corners.map(([x, y]) => { let a = Math.atan2(y - c.y, x - c.x) - mid; return a - 2 * Math.PI * Math.round(a / (2 * Math.PI)); });
    const a0 = mid + Math.min(...rel), a1 = mid + Math.max(...rel), n = Math.ceil((a1 - a0) * r / 4);
    let d = "";
    for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; d += `${i ? "L" : "M"}${(c.x + r * Math.cos(a)).toFixed(1)},${(c.y + r * Math.sin(a)).toFixed(1)}`; }
    return d;
  }

  // Polygons are written once, in local units around the centre, and moved with one transform per
  // frame. Projecting every vertex on every frame made the page crawl once the city line was on.
  const K = 1e6;
  const ringsD = (rings) => rings.map((ring) => "M" + ring.map(([lon, lat]) => {
    const p = toVp(lon, lat); return `${((p.x - C_VP.x) * K).toFixed(3)},${((p.y - C_VP.y) * K).toFixed(3)}`;
  }).join("L") + "Z").join("");
  function geoTransform() {
    const c = vp().pixelFromPoint(C_VP, true), k = vp().deltaPixelsFromPoints(new OSD.Point(1, 0), true).x / K;
    return `matrix(${k} 0 0 ${k} ${c.x} ${c.y})`;
  }
  function drawCity() {
    const city = document.querySelector("#fade .city");
    city.setAttribute("d", state.on.has("c") && cityRings ? ringsD(cityRings) : "");
    city.style.opacity = OVERLAYS.find((o) => o.id === "c").opacity;
  }

  // ── city limits: the municipality polygon under Main and Liberty, fetched once ──
  let cityRings = null, cityLoading = false;
  async function loadCity() {
    if (cityRings || cityLoading) return;
    cityLoading = true;
    const r = await getJSON(`${MIGF}/2/query?geometry=${CENTER.join(",")}&geometryType=esriGeometryPoint&inSR=4326` +
      `&spatialRel=esriSpatialRelIntersects&outFields=NAME&returnGeometry=true&outSR=4326&maxAllowableOffset=0.00002&f=json`);
    cityLoading = false;
    cityRings = r?.features?.[0]?.geometry?.rings || null;
    drawCity();
  }

  // ── fetch helpers ───────────────────────────────────────────────────────
  const cache = new Map();
  async function getJSON(url, opts) {
    const key = url + (opts ? JSON.stringify(opts.headers || {}) : "");
    if (cache.has(key)) return cache.get(key);
    const p = fetch(url, opts).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    cache.set(key, p);
    const v = await p;
    if (v === null || v?.error) cache.delete(key);
    return v?.error ? null : v;
  }
  // Point query against one layer of an ArcGIS MapServer; Esri JSON comes back in WGS 84.
  const atPoint = (svc, layer, lon, lat, fields = "*", geometry = false) => getJSON(`${svc}/${layer}/query?` +
    `geometry=${lon.toFixed(7)},${lat.toFixed(7)}&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects` +
    `&outFields=${encodeURIComponent(fields)}&returnGeometry=${geometry}&outSR=4326&f=json`);
  // Features within `m` metres of a point (Esri buffers it server-side), or only their count.
  const near = (svc, layer, lon, lat, m, fields = "*", count = false) => getJSON(`${svc}/${layer}/query?` +
    `geometry=${lon.toFixed(7)},${lat.toFixed(7)}&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects` +
    `&distance=${m}&units=esriSRUnit_Meter&outFields=${encodeURIComponent(fields)}&returnGeometry=${!count}&returnCountOnly=${count}&outSR=4326&f=json`);
  // Features that touch a parcel polygon.
  const onRings = (svc, layer, rings, fields = "*") => getJSON(`${svc}/${layer}/query?` +
    `geometry=${encodeURIComponent(JSON.stringify({ rings: rings.map((r) => r.map(([x, y]) => [+x.toFixed(6), +y.toFixed(6)])) }))}` +
    `&geometryType=esriGeometryPolygon&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=${encodeURIComponent(fields)}&returnGeometry=false&f=json`);
  const where = (svc, layer, clause, n = 8) => getJSON(`${svc}/${layer}/query?where=${encodeURIComponent(clause)}` +
    `&outFields=*&returnGeometry=true&outSR=4326&resultRecordCount=${n}&f=json`);

  // ── highlight, pin and listing markers ─────────────────────────────────
  let shapes = [], pin = null, listings = [], selListing = null, auction = [], selAuction = null;
  // Called when the shapes change; placeOverlay runs every frame.
  function drawOverlay() {
    const q = (sel) => document.querySelector(`#hl ${sel}`);
    q(".aucs").innerHTML = auction.map((f, i) => `<path class="auc${f === selAuction ? " sel" : ""}" data-a="${i}" d="${f.d ||= ringsD(f.rings)}"/>`).join("");
    q(".shapes").innerHTML = shapes.map((rings) => `<path d="${ringsD(rings)}"/>`).join("");
    placeOverlay();
  }
  function placeOverlay() {
    const z = displayZ();
    document.querySelector("#hl .geo").setAttribute("transform", geoTransform());
    document.querySelector("#hl .aucs").style.display = z >= 11 ? "" : "none";
    const pts = document.querySelector("#hl .pts");
    if (!pin && !listings.length) { if (pts.firstChild) pts.innerHTML = ""; return; }
    const pt = (lon, lat) => vp().pixelFromPoint(toVp(lon, lat), true);
    const size = vp().getContainerSize();
    let out = "";
    listings.forEach((l, i) => {
      const p = pt(l.longitude, l.latitude);
      if (p.x < -40 || p.y < -40 || p.x > size.x + 40 || p.y > size.y + 40) return;
      const label = z >= 15 && l.price ? `<text x="${(p.x + 8).toFixed(1)}" y="${(p.y + 4).toFixed(1)}">${esc(money(l.price, true))}</text>` : "";
      out += `<g class="ls${l === selListing ? " sel" : ""}" data-i="${i}"><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${z >= 14 ? 6 : 4.5}"/>${label}</g>`;
    });
    if (pin) { const p = pt(...pin); out += `<circle class="pin" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6"/>`; }
    pts.innerHTML = out;
  }
  $("hl").addEventListener("click", (e) => {
    const g = e.target.closest("g.ls");
    if (g) { e.stopPropagation(); showListing(listings[+g.dataset.i]); return; }
    const a = e.target.closest("path.auc");
    if (a) { e.stopPropagation(); showAuction(auction[+a.dataset.a]); }
  });
  $("hl").addEventListener("pointerdown", (e) => { if (e.target.closest("g.ls, path.auc")) e.stopPropagation(); });

  function bboxOfRings(rings) {
    let w = 180, s = 90, e = -180, n = -90;
    for (const ring of rings) for (const [lon, lat] of ring) { w = Math.min(w, lon); e = Math.max(e, lon); s = Math.min(s, lat); n = Math.max(n, lat); }
    return [w, s, e, n];
  }
  const nf = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
  const money = (v, short = false) => v == null || v === "" ? "" : short && v >= 1e6 ? `$${(v / 1e6).toFixed(v >= 1e7 ? 0 : 2)}M`
    : short && v >= 1e3 ? `$${Math.round(v / 1e3)}K` : `$${nf.format(v)}`;
  const titleCase = (s) => String(s || "").toLowerCase().replace(/\b[a-z]/g, (c) => c.toUpperCase());

  // ── info card ───────────────────────────────────────────────────────────
  function showInfo(html) {
    $("info").innerHTML = `<button class="close" aria-label="Close">&times;</button>${html}`;
    $("info").classList.add("open");
    $("info").querySelector(".close").onclick = clearSelection;
  }
  // Links whose site cannot take the parcel in its URL copy it on the way out.
  $("info").addEventListener("click", (e) => {
    const link = e.target.closest("a[data-copy]");
    if (!link) return;
    navigator.clipboard?.writeText(link.dataset.copy).catch(() => {});
    const note = $("copied");
    if (note) { note.hidden = false; note.textContent = `Copied ${link.dataset.copy}: paste it into that site's search.`; }
  });
  function clearSelection() { $("info").classList.remove("open"); shapes = []; pin = null; selListing = null; selAuction = null; drawOverlay(); setQuery(""); }
  // The selected property goes in the query string so the URL reopens it; the hash keeps the view.
  const setQuery = (qs) => history.replaceState(null, "", location.pathname + (qs ? `?${qs}` : "") + location.hash);
  const dl = (rows) => `<dl>${rows.filter((r) => r && r[1] !== "" && r[1] != null).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;

  // Portal links for an address. None of these sites has a public API, and Redfin and Realtor.com
  // address pages carry an internal id, so those two go through DuckDuckGo's "\" (first result)
  // search restricted to the site, which lands on the property page when the site has one.
  const lucky = (site, addr) => `https://duckduckgo.com/?q=${encodeURIComponent(`\\ site:${site} ${addr}`)}`;
  const portals = (addr) => `<div class="links">` +
    `<a href="https://www.zillow.com/homes/${encodeURIComponent(addr.replace(/[,#]/g, " ").trim().replace(/\s+/g, "-"))}_rb/" target="_blank" rel="noopener">Zillow</a>` +
    `<a href="${lucky("redfin.com", addr)}" target="_blank" rel="noopener">Redfin</a>` +
    `<a href="${lucky("realtor.com", addr)}" target="_blank" rel="noopener">Realtor.com</a>` +
    `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}" target="_blank" rel="noopener">Google Maps</a></div>`;

  const ownerAddr = (a) => {
    const st = String(a.OWNSTADDR || "").trim();
    if (!st) return "";
    if (st.toUpperCase().replace(/\s+/g, " ") === String(a.PRPACOM || "").toUpperCase().replace(/\s+/g, " ")) return "Same as the property";
    return esc(`${titleCase(st)}, ${titleCase(a.OWNCITY || "")}, ${a.OWNSTATE || ""} ${a.OWNZIP || ""}`.trim());
  };
  const metres = (lon, lat, x, y) => Math.hypot((x - lon) * 111320 * Math.cos(lat * Math.PI / 180), (y - lat) * 110540);
  const ptOf = (g) => g ? (g.points ? g.points[0] : [g.x, g.y]) : null;
  const PIPE = { GA: "galvanized", CU: "copper", COPPER: "copper", "COPPER/IRON": "copper and iron", DI: "ductile iron", CI: "cast iron",
    PB: "lead", LEAD: "lead", HDPE: "plastic", PE: "plastic", "PE-RT": "plastic", PEX: "plastic", OTH: "other", UNK: "unknown" };
  // The city's service-line point nearest the click: material on the city's side and on the owner's.
  function waterLine(r, lon, lat) {
    const fs = (r?.features || []).filter((x) => ptOf(x.geometry));
    if (!fs.length) return "";
    const w = fs.sort((p, q) => metres(lon, lat, ...ptOf(p.geometry)) - metres(lon, lat, ...ptOf(q.geometry)))[0].attributes;
    const m = (v) => v == null || v === "" ? "unknown" : PIPE[String(v).toUpperCase()] || String(v).toLowerCase();
    const city = m(w.MATERIAL), own = m(w.MaterialHomeOwnerSide ?? w.MATERIALHOMEOWNERSIDE);
    const txt = `City side ${city}, owner side ${own}`;
    return /lead|galvanized/.test(txt) ? `<span class="warn">${esc(txt)}</span>` : esc(txt);
  }
  function nearbySites(sites, tanks, lon, lat) {
    const list = [
      ...(sites?.features || []).map((x) => ({ name: x.attributes.SiteName, kind: "Part 201 site", p: ptOf(x.geometry) })),
      ...(tanks?.features || []).filter((x) => x.attributes.Open_Release > 0 || /open/i.test(x.attributes.ReleaseStatus || ""))
        .map((x) => ({ name: x.attributes.FacilityName, kind: "leaking tank", p: ptOf(x.geometry) })),
    ].filter((x) => x.p).map((x) => ({ ...x, d: metres(lon, lat, ...x.p) })).sort((p, q) => p.d - q.d);
    if (!list.length) return sites || tanks ? "None listed" : "";
    const n = list[0];
    return `<span class="warn">${list.length}</span> · nearest ${esc(titleCase(n.name || n.kind))} (${esc(n.kind)}, ${nf.format(n.d * 3.28084)} ft)`;
  }
  // "315 E LIBERTY ST" → "LIBERTY"; A2Trak and STREAM want the address without the street suffix.
  const SUFFIX = /\s+(ST|AVE|AV|RD|DR|CT|BLVD|LN|PL|CIR|WAY|TER|TRL|PKWY|HWY|PARK|SQ)\.?$/i;
  const addrNoSuffix = (s) => String(s || "").trim().replace(/\s+(APT|UNIT|#).*$/i, "").replace(SUFFIX, "");
  const streetOf = (s) => addrNoSuffix(s).replace(/^\d+[A-Z]?\s+/i, "").replace(/^(N|S|E|W)\s+/i, "").trim();
  function aapsPage(street) {
    const c = street[0].toLowerCase();
    const page = { i: "i-j", j: "i-j", q: "q-r", r: "q-r", u: "u-v", v: "u-v", x: "x-y-z", y: "x-y-z", z: "x-y-z" }[c] || c;
    // The text fragment scrolls to and highlights the street on the letter's page.
    return `https://www.a2schools.org/about-aaps/attendance-area-by-street-directory/streets-starting-with-${page}#:~:text=${encodeURIComponent(titleCase(street))}`;
  }
  const CLASS = { "201": "Commercial", "301": "Industrial", "401": "Residential", "402": "Residential vacant", "407": "Residential condo" };
  const yes = (v) => /^(y|yes|true|1)$/i.test(String(v ?? "").trim());

  let seq = 0;
  async function identify(lon, lat, { fit = false, known = null } = {}) {
    const my = ++seq;
    selListing = null;
    pin = [lon, lat]; shapes = []; drawOverlay();
    showInfo(`<div class="sub">Looking up records…</div>`);
    const parcelQ = known ? Promise.resolve({ features: [known] }) : atPoint(A2, 13, lon, lat, "*", true);
    // Easements rarely cover the clicked point, so they are matched against the whole parcel.
    const easeQ = parcelQ.then((r) => r?.features?.[0]?.geometry?.rings ? onRings(A2, 16, r.features[0].geometry.rings, "TITLEDESC,ESMTOWNER,ESMTWIDTH") : null);
    const [parcel, zoning, hist, flood, school, muni, dda, ward, project, rental, wetland, water, sites, tanks, crashes, ease] = await Promise.all([
      parcelQ,
      atPoint(A2, 19, lon, lat, "ZONINGCLASS,Ordname"),
      atPoint(A2, 18, lon, lat),
      atPoint(FEMA, 28, lon, lat, "FLD_ZONE,ZONE_SUBTY,SFHA_TF,STATIC_BFE"),
      atPoint(MIGF, 10, lon, lat, "NAME"),
      atPoint(MIGF, 2, lon, lat, "NAME,LABEL,TYPE"),
      atPoint(A2, 12, lon, lat, "NAME,IN_DDA"),
      atPoint(A2, 21, lon, lat, "WARD,PRECINCT"),
      atPoint(A2, 40, lon, lat, "PROJECTNUMBER,PROJECTNAME,PROJECTTYPE,STATUS"),
      atPoint(A2, 43, lon, lat, "STR_Property,CR_Property,NONCONFORMING"),
      atPoint(NWI, 0, lon, lat, "WETLAND_TYPE,ATTRIBUTE"),
      near(`${A2MAPS}/WaterServiceLeadMaterialAll/MapServer`, 0, lon, lat, 40),
      near(EGLE, 0, lon, lat, 402, "SiteName,Address,RiskCondition"),
      near(EGLE, 1, lon, lat, 402, "FacilityName,Address,ReleaseStatus,Open_Release"),
      near(`${A2MAPS}/RoadsSpeedlimitCrash/MapServer`, 0, lon, lat, 91, "", true),
      easeQ,
    ]);
    if (my !== seq) return;
    const f = parcel?.features?.[0], a = f?.attributes || {};
    if (f?.geometry?.rings) { shapes = [f.geometry.rings]; pin = null; }
    drawOverlay();

    const addr = titleCase(a.PRPACOM || "");
    const place = muni?.features?.[0]?.attributes;
    const placeName = place ? (place.LABEL || place.NAME) : "";
    const z = zoning?.features?.[0]?.attributes;
    const fz = flood?.features?.[0]?.attributes;
    const hd = hist?.features?.[0]?.attributes;
    const hdName = hd ? (hd.NAME || hd.Name || hd.DISTRICT || hd.HDNAME || Object.values(hd).find((v) => typeof v === "string" && v.length > 3)) : "";

    let html = `<h2>${esc(addr || (f ? `Parcel ${a.PIN}` : "No city parcel here"))}</h2>` +
      `<div class="sub">${esc(placeName)}${placeName ? " · " : ""}${milesFrom(lon, lat).toFixed(1)} mi from downtown</div>`;
    if (f) {
      const sqft = a.residentialArea || a.commercialArea;
      const pr = project?.features?.[0]?.attributes, rc = rental?.features?.[0]?.attributes;
      html += `<h3>Parcel</h3>` + dl([
        ["Parcel no.", esc(a.PIN)],
        ["Owner", esc(titleCase([a.OWNNAME1, a.OWNNAME2].filter(Boolean).join(" / ")))],
        ["Owner's address", ownerAddr(a)],
        ["Use", esc(titleCase(a.LANDUSE || "") || CLASS[a.propclass] || a.propclass || "")],
        ["Tax class", a.propclass ? esc(`${a.propclass}${CLASS[a.propclass] ? ` (${CLASS[a.propclass]})` : ""}`) + (yes(a.isExempt) ? " · exempt" : "") : ""],
        ["Year built", a.yearbuilt > 1700 ? a.yearbuilt : ""],
        ["Floor area", sqft ? `${nf.format(sqft)} sq ft` : ""],
        ["Lot", a.totalacres ? `${a.totalacres.toFixed(a.totalacres < 1 ? 3 : 2)} acres` : ""],
        ["Frontage", a.frontFootage > 0 ? `${nf.format(a.frontFootage)} ft` : ""],
        ["Condo", yes(a.Condo) ? "Yes" : ""],
        ["Land value", a.taxyear_landvalue ? money(a.taxyear_landvalue) : ""],
        ["Highest sale", a.HighestSaleEver ? money(a.HighestSaleEver) : ""],
        ["Sale $/sq ft", a.price_per_sqft ? `$${Math.round(a.price_per_sqft)}` : ""],
        ["Neighborhood", esc(titleCase(a.NEIGHBORHOOD || ""))],
        ["Ward", esc(a.WARDS || "")],
        ["Rental", rc ? esc([yes(rc.CR_Property) && "Certified rental", yes(rc.STR_Property) && "Short-term rental", yes(rc.NONCONFORMING) && "nonconforming"].filter(Boolean).join(", ") || "Rental case on file") : ""],
        ["City project", pr ? esc([pr.PROJECTNAME, pr.PROJECTTYPE, pr.STATUS].filter(Boolean).map(titleCase).join(" · ")) : ""],
      ]);
    } else if (parcel === null) {
      html += `<p class="warn">The City of Ann Arbor parcel service did not answer.</p>`;
    } else {
      html += `<p class="sub">Parcel records here come from the City of Ann Arbor and cover the city only. Outside it, use the township's assessor or the county's property search below.</p>`;
    }
    html += `<h3>Rules and risks</h3>` + dl([
      ["Zoning", z ? esc(z.ZONINGCLASS) : f ? esc(a.ZONING_csGIS || "") : zoning === null ? "<span class='warn'>no answer</span>" : "Outside city zoning"],
      ["Historic district", hd ? esc(hdName || "Yes") : f && a.HDC && a.HDC !== "N" ? esc(a.HDC) : ""],
      ["Flood zone", fz ? `${esc(fz.FLD_ZONE)}${fz.ZONE_SUBTY ? ` (${esc(titleCase(fz.ZONE_SUBTY))})` : ""}${fz.SFHA_TF === "T" ? " · <span class='warn'>special flood hazard area</span>" : ""}`
        : flood === null ? "<span class='warn'>FEMA did not answer</span>" : "Not in a mapped flood zone"],
      ["Wetland", wetland?.features?.[0] ? esc(wetland.features[0].attributes.WETLAND_TYPE || "Mapped wetland") + " <span class='sub'>(USFWS)</span>" : ""],
      ["Easements", (ease?.features || []).length ? esc([...new Set(ease.features.map((e) => titleCase([e.attributes.TITLEDESC, e.attributes.ESMTOWNER && `to ${e.attributes.ESMTOWNER}`, e.attributes.ESMTWIDTH > 0 && `${e.attributes.ESMTWIDTH} ft`].filter(Boolean).join(" "))))].join("; ")) : ""],
      ["Water service", waterLine(water, lon, lat)],
      ["Contamination within ¼ mi", nearbySites(sites, tanks, lon, lat)],
      ["Crashes within 300 ft", crashes?.count > 0 ? `${crashes.count} on record` : ""],
      ["Downtown (DDA)", dda?.features?.[0] ? "Inside the DDA" : ""],
      ["Ward and precinct", ward?.features?.[0] ? esc(`${ward.features[0].attributes.WARD}-${ward.features[0].attributes.PRECINCT}`) : ""],
      ["School district", esc(titleCase(school?.features?.[0]?.attributes?.NAME || ""))],
    ]);
    if (addr) html += `<h3>Listings and history</h3>` + portals(`${addr}, ${placeName && !/township/i.test(placeName) ? placeName.replace(/^City of /, "") : "Ann Arbor"}, MI`);
    // BS&A, Census Reporter and the AAPS directory take the parcel or street in the URL. The county
    // search, A2Trak and the Register of Deeds only take form posts, so those links copy what to
    // paste into the search before opening it.
    const pinRaw = String(a.PIN || "").trim();
    // BS&A and the county write parcel numbers as 09-09-29-123-004.
    const pinTxt = /^\d{12}$/.test(pinRaw) ? pinRaw.replace(/^(\d\d)(\d\d)(\d\d)(\d{3})(\d{3})$/, "$1-$2-$3-$4-$5") : pinRaw, street = streetOf(a.PRPACOM);
    const ext = (href, label, copy = "") => `<a href="${esc(href)}" target="_blank" rel="noopener"${copy ? ` data-copy="${esc(copy)}"` : ""}>${label}</a>`;
    html += `<h3>Official records</h3><div class="links">` +
      (pinTxt ? ext(`https://bsaonline.com/SiteSearch/SiteSearchDetails?SearchCategory=Parcel+Number&SearchText=${encodeURIComponent(pinTxt)}` +
        `&SearchFocus=&uid=283&PageIndex=1&ReferenceKey=${encodeURIComponent(pinTxt)}&ReferenceType=0&SortBy=&SearchOrigin=0`, "City assessor and taxes (BS&amp;A)") : "") +
      (pinTxt ? ext("https://secure4.ewashtenaw.org/parcelsearch/home.xhtml", "County property search", pinTxt) : "") +
      (f && addr ? ext(`https://stream.a2gov.org/EnerGov_Prod/SelfService#/search?m=1&fm=1&ps=10&pn=1&em=true&st=${encodeURIComponent(addrNoSuffix(a.PRPACOM))}`, "Permits and rentals (STREAM)") : "") +
      (f && addr ? ext("https://secure.a2gov.org/A2Trak/PermitSearch", "Permits 2008–2022 (A2Trak)", addrNoSuffix(a.PRPACOM)) : "") +
      ext("https://ssclerk.ewashtenaw.org/web/", "Deeds (Register of Deeds)", pinTxt || "") +
      (/^\d{11}/.test(a.GEOID || "") ? ext(`https://censusreporter.org/profiles/14000US${a.GEOID.slice(0, 11)}`, "Census tract profile") : "") +
      (street && /ann arbor/i.test(school?.features?.[0]?.attributes?.NAME || "") ? ext(aapsPage(street), "AAPS schools for this street") : "") +
      (a.StreetView && /^https?:/.test(a.StreetView) ? ext(a.StreetView, "Street View") : "") + `</div>` +
      `<p class="sub" id="copied" hidden></p>`;
    showInfo(html);
    if (fit && f?.geometry?.rings) fitLonLat(...bboxOfRings(f.geometry.rings), 19);
  }

  // Single click identifies; wait out a possible double-click (which zooms).
  let clickTimer = 0;
  viewer.addHandler("canvas-click", (e) => {
    if (!e.quick) return;
    const [lon, lat] = fromVp(vp().pointFromPixel(e.position));
    clearTimeout(clickTimer);
    closeResults();
    if (milesFrom(lon, lat) > MILES + 0.5) return;
    clickTimer = setTimeout(() => { identify(lon, lat); setQuery(`ll=${lat.toFixed(6)},${lon.toFixed(6)}`); }, 260);
  });
  viewer.addHandler("canvas-double-click", () => clearTimeout(clickTimer));

  // ── tax-foreclosure auction parcels: Washtenaw County publishes this year's list as an open layer ──
  async function loadAuction() {
    $("aucMsg").hidden = false; $("aucMsg").textContent = "Loading…";
    const r = await getJSON(`${AUCTION}/query?where=1%3D1&outFields=*&returnGeometry=true&outSR=4326&resultRecordCount=2000&f=json`);
    if (!$("aucOn").checked) return;
    if (!r?.features) { $("aucMsg").textContent = "The county auction layer did not answer."; return; }
    auction = r.features.filter((f) => f.geometry?.rings).map((f) => ({ rings: f.geometry.rings, a: f.attributes }));
    $("aucMsg").textContent = `${auction.length} parcels on the county's 2026 auction list. Zoom in and click one.`;
    drawOverlay(); attribution();
  }
  $("aucOn").checked = store.get("a2re.aucOn") === "1";
  $("aucOn").onchange = () => {
    store.set("a2re.aucOn", $("aucOn").checked ? "1" : "");
    if ($("aucOn").checked) loadAuction(); else { auction = []; selAuction = null; $("aucMsg").hidden = true; drawOverlay(); attribution(); }
  };
  if ($("aucOn").checked) loadAuction();
  function showAuction(f) {
    selAuction = f; selListing = null; seq++; shapes = []; pin = null; drawOverlay();
    const a = f.a;
    const addr = titleCase([a.PROP_STREE ? Math.round(a.PROP_STREE) : "", a.PROP_STR_1, a.UNIT_APT_N ? `#${a.UNIT_APT_N}` : ""].filter(Boolean).join(" "));
    const city = titleCase(a.PROP_CITY || "");
    showInfo(`<h2>${esc(addr || `Parcel ${a.PIN}`)}</h2><div class="sub">${esc(city)}${city ? " · " : ""}2026 tax-foreclosure auction</div>` +
      `<p class="sub">The County Treasurer sells these at auction; bidding terms and dates are on the Treasurer's pages.</p>` + dl([
      ["Parcel no.", esc(a.PIN)],
      ["Jurisdiction", esc(titleCase(a.CVT_DESCRI || ""))],
      ["Class", esc(titleCase(a.PROP_CLA_1 || a.PROP_CLASS || ""))],
      ["Status", esc(titleCase(a.STATUS_DES || ""))],
      ["SEV", a.SEV ? money(a.SEV) : ""],
      ["Taxable value", a.TAXABLE_VA ? money(a.TAXABLE_VA) : ""],
      ["Building area", a.BUILDING_A ? `${nf.format(a.BUILDING_A)} sq ft` : ""],
      ["Acreage", a.ACREAGE_OF ? (+a.ACREAGE_OF).toFixed(2) : ""],
      ["School district", esc(titleCase(a.SCHOOL_NAM || ""))],
    ]) + `<div class="links"><a href="https://secure4.ewashtenaw.org/parcelsearch/viewAllReports.xhtml" target="_blank" rel="noopener">County property search</a></div>`);
  }

  // ── listings: RentCast with the viewer's own key ───────────────────────
  // RentCast is the only listing source found that sells a self-serve key; the portals and MLS feeds
  // need a broker agreement. The key is kept in localStorage and sent only to api.rentcast.io.
  $("lsKey").value = store.get("a2re.rentcast") || "";
  $("lsOn").checked = !!$("lsKey").value && store.get("a2re.lsOn") === "1";
  $("lsBox").hidden = !$("lsOn").checked;
  $("lsOn").onchange = () => {
    $("lsBox").hidden = !$("lsOn").checked;
    store.set("a2re.lsOn", $("lsOn").checked ? "1" : "");
    if (!$("lsOn").checked) { listings = []; drawOverlay(); attribution(); }
  };
  $("lsKey").onchange = () => store.set("a2re.rentcast", $("lsKey").value.trim());
  for (const id of ["lsMin", "lsMax"]) { $(id).value = store.get(`a2re.${id}`) || ""; $(id).onchange = () => store.set(`a2re.${id}`, $(id).value); }
  $("lsLoad").onclick = async () => {
    const key = $("lsKey").value.trim();
    if (!key) { $("lsMsg").textContent = "Add a key first"; return; }
    store.set("a2re.rentcast", key);
    const c = vp().getCenter(false), b = vp().getBounds(false);
    const [lon, lat] = fromVp(c), [lon1, lat1] = fromVp(new OSD.Point(b.x, b.y));
    const radius = Math.min(MILES, Math.max(0.5, milesFrom(lon1, lat1) - milesFrom(lon, lat) + Math.hypot(lon - lon1, lat - lat1) * 69 * 0.75));
    const min = +$("lsMin").value || 0, max = +$("lsMax").value || 0;
    const url = `https://api.rentcast.io/v1/listings/sale?latitude=${lat.toFixed(5)}&longitude=${lon.toFixed(5)}&radius=${radius.toFixed(1)}` +
      `&status=Active&limit=500`;
    $("lsMsg").textContent = "Loading…";
    let data = null, err = "";
    try {
      const r = await fetch(url, { headers: { "X-Api-Key": key, Accept: "application/json" } });
      if (r.ok) data = await r.json(); else err = r.status === 401 ? "Key rejected" : r.status === 429 ? "Monthly limit reached" : `Error ${r.status}`;
    } catch { err = "Blocked or offline"; }
    if (!Array.isArray(data)) { $("lsMsg").textContent = err || "No data"; return; }
    listings = data.filter((l) => isFinite(l.latitude) && isFinite(l.longitude) && milesFrom(l.longitude, l.latitude) <= MILES &&
      (!min || l.price >= min) && (!max || l.price <= max));
    $("lsMsg").textContent = `${listings.length} of ${data.length} within ${radius.toFixed(1)} mi`;
    drawOverlay(); attribution();
  };
  function showListing(l) {
    selListing = l; seq++; shapes = []; pin = null; drawOverlay();
    const addr = l.formattedAddress || [l.addressLine1, l.city, l.state].filter(Boolean).join(", ");
    showInfo(`<h2>${esc(money(l.price))}</h2><div class="sub">${esc(addr)}</div>` + dl([
      ["Type", esc(l.propertyType || "")],
      ["Beds / baths", l.bedrooms != null || l.bathrooms != null ? `${l.bedrooms ?? "?"} / ${l.bathrooms ?? "?"}` : ""],
      ["Floor area", l.squareFootage ? `${nf.format(l.squareFootage)} sq ft` : ""],
      ["$/sq ft", l.price && l.squareFootage ? `$${Math.round(l.price / l.squareFootage)}` : ""],
      ["Lot", l.lotSize ? `${nf.format(l.lotSize)} sq ft` : ""],
      ["Year built", l.yearBuilt || ""],
      ["HOA", l.hoa?.fee ? `${money(l.hoa.fee)}/mo` : ""],
      ["Listed", l.listedDate ? esc(l.listedDate.slice(0, 10)) + (l.daysOnMarket != null ? ` (${l.daysOnMarket} days)` : "") : ""],
      ["Office", esc(l.listingOffice?.name || "")],
    ]) + portals(addr) + `<p><button class="btn" id="lsRec">Parcel records here</button></p>`);
    const b = $("lsRec");
    if (b) { b.style.cssText = "border:1px solid var(--line);background:none;border-radius:5px;padding:3px 8px;cursor:pointer"; b.onclick = () => identify(l.longitude, l.latitude); }
  }

  // Portal searches for the current view. Zillow takes map bounds in its URL; Redfin and Realtor.com take a place.
  function portalLinks() {
    const b = vp().getBounds(false);
    const [w, n] = fromVp(new OSD.Point(b.x, b.y)), [e, s] = fromVp(new OSD.Point(b.x + b.width, b.y + b.height));
    const zs = { mapBounds: { west: +w.toFixed(5), east: +e.toFixed(5), south: +s.toFixed(5), north: +n.toFixed(5) }, isMapVisible: true,
      filterState: { sort: { value: "days" } } };
    $("portalLinks").innerHTML = `<span class="note" style="margin:0">Search this view on </span>` +
      `<a href="https://www.zillow.com/homes/for_sale/?searchQueryState=${encodeURIComponent(JSON.stringify(zs))}" target="_blank" rel="noopener">Zillow</a>` +
      `<a href="https://www.redfin.com/city/782/MI/Ann-Arbor" target="_blank" rel="noopener">Redfin</a>` +
      `<a href="https://www.realtor.com/realestateandhomes-search/Ann-Arbor_MI" target="_blank" rel="noopener">Realtor.com</a>`;
  }

  // ── search: addresses and places (Esri geocoder), parcel numbers (city parcels) ──
  const q = $("q"), list = $("results");
  let found = [], active = -1, searchSeq = 0, searchTimer = 0;
  const GEOCODE = "https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates";
  const PIN = /^[A-Za-z]?\s*\d{2}[-\s]?\d{2}[-\s]?\d{2}[-\s]?\d{3}[-\s]?\d{3}$/;

  async function search(text) {
    const my = ++searchSeq;
    let out = [];
    if (PIN.test(text)) {
      const digits = text.replace(/\D/g, "");
      const r = await where(A2, 13, `PIN LIKE '%${digits.slice(0, 2)}%${digits.slice(2, 4)}%${digits.slice(4, 6)}%${digits.slice(6, 9)}%${digits.slice(9)}'`, 5);
      if (my !== searchSeq) return;
      for (const f of r?.features || []) {
        const [w, s, e, n] = bboxOfRings(f.geometry?.rings || []);
        out.push({ kind: "Parcel", label: f.attributes.PIN, query: `pin=${encodeURIComponent(f.attributes.PIN)}`, sub: titleCase(f.attributes.PRPACOM || ""),
          go: () => identify((w + e) / 2, (s + n) / 2, { fit: true, known: f }) });
      }
      if (!out.length) out.push({ label: r ? `No city parcel ${text}` : "The city parcel service did not answer", msg: true });
    } else {
      const r = await getJSON(`${GEOCODE}?SingleLine=${encodeURIComponent(text)}&searchExtent=${AREA.join(",")}` +
        `&location=${CENTER.join(",")}&maxLocations=8&outFields=Addr_type,City,Region,Type&forStorage=false&f=json`);
      if (my !== searchSeq) return;
      for (const c of r?.candidates || []) {
        const { x: lon, y: lat } = c.location;
        if (milesFrom(lon, lat) > MILES) continue;
        const kind = /Address|Subaddress|PointAddress|StreetAddress/.test(c.attributes.Addr_type) ? "Address" : c.attributes.Type || c.attributes.Addr_type || "Place";
        out.push({ kind, label: c.address.split(",")[0], query: `q=${encodeURIComponent(c.address.split(",").slice(0, 2).join(","))}`, sub: c.address.split(",").slice(1, 3).join(",").trim(),
          go: () => {
            const z = kind === "Address" ? 18 : 15;
            setView(lon, lat, z);
            if (kind === "Address") identify(lon, lat); else { pin = [lon, lat]; shapes = []; drawOverlay(); $("info").classList.remove("open"); }
          } });
      }
      if (!out.length) out.push({ label: r ? "No matches within 10 miles" : "The search service did not answer", msg: true });
    }
    found = out.slice(0, 7); active = found.findIndex((r) => !r.msg);
    renderResults();
  }
  function renderResults() {
    list.innerHTML = found.map((r, i) => r.msg ? `<li class="msg">${esc(r.label)}</li>` :
      `<li role="option" data-i="${i}" aria-selected="${i === active}"><span class="k">${esc(r.kind)}</span><span>${esc(r.label)}</span><span class="s">${esc(r.sub)}</span></li>`).join("");
    list.classList.toggle("open", found.length > 0);
    q.setAttribute("aria-expanded", found.length > 0);
  }
  function closeResults() { list.classList.remove("open"); q.setAttribute("aria-expanded", "false"); }
  function pick(i) {
    const r = found[i];
    if (!r || r.msg) return;
    closeResults(); q.blur(); layersPanel(false);
    r.go();
    if (r.query) setQuery(r.query);
  }
  q.addEventListener("input", () => {
    clearTimeout(searchTimer);
    const t = q.value.trim();
    if (t.length < 3) { found = []; renderResults(); return; }
    searchTimer = setTimeout(() => search(t), 300);
  });
  q.addEventListener("keydown", (e) => {
    const n = found.length;
    if (e.key === "ArrowDown" && n) { e.preventDefault(); do active = (active + 1) % n; while (found[active].msg && found.some((r) => !r.msg)); renderResults(); }
    else if (e.key === "ArrowUp" && n) { e.preventDefault(); do active = (active - 1 + n) % n; while (found[active].msg && found.some((r) => !r.msg)); renderResults(); }
    else if (e.key === "Enter") {
      e.preventDefault();
      clearTimeout(searchTimer);
      if (active >= 0 && found.length) pick(active);
      else if (q.value.trim().length >= 3) search(q.value.trim()).then(() => pick(active));
    } else if (e.key === "Escape") closeResults();
  });
  q.addEventListener("focus", () => { if (found.length) renderResults(); });
  list.addEventListener("mousedown", (e) => { const li = e.target.closest("li[data-i]"); if (li) { e.preventDefault(); pick(+li.dataset.i); } });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== q && !/INPUT|SELECT/.test(document.activeElement?.tagName)) { e.preventDefault(); q.focus(); q.select(); }
    if (e.key === "Escape" && document.activeElement !== q) clearSelection();
  });

  // ── start ───────────────────────────────────────────────────────────────
  applyLayers().then(() => {
    clampZoom();
    if (state.view) setView(state.view[2], state.view[1], state.view[0], true);
    else home(true);
    lastBand = null;
    checkBands();
    scaleBar();
    drawFade();
    portalLinks();
    lookupFromQuery();
  });

  // ?q=315 E Liberty St (address, place or parcel number), ?pin=09-09-29-123-004, or ?ll=42.2794,-83.7448
  // opens that property's card on load. The hash still carries the view.
  async function lookupFromQuery() {
    const p = new URLSearchParams(location.search);
    const ll = (p.get("ll") || "").split(",").map(Number);
    const lat = ll.length === 2 ? ll[0] : +p.get("lat"), lon = ll.length === 2 ? ll[1] : +(p.get("lon") || p.get("lng"));
    if (isFinite(lat) && isFinite(lon) && lat && lon) {
      if (milesFrom(lon, lat) > MILES) { showInfo(`<p>${fmt(lat, "N", "S")} ${fmt(lon, "E", "W")} is outside the 10-mile map.</p>`); return; }
      setView(lon, lat, 18, true);
      identify(lon, lat);
      return;
    }
    const text = (p.get("pin") || p.get("q") || "").trim();
    if (text.length < 3) return;
    q.value = text;
    await search(text);
    if (active >= 0) pick(active);
    else { closeResults(); showInfo(`<p>${esc(found[0]?.label || "No matches")} for “${esc(text)}”.</p>`); }
  }
  window.addEventListener("hashchange", () => {
    readHash();
    document.querySelectorAll("#bases input").forEach((i) => (i.checked = i.value === state.base));
    document.querySelectorAll("#mix input[type=checkbox], #records input[type=checkbox], #bounds input[type=checkbox]").forEach((i) => {
      i.checked = state.on.has(i.value);
      document.querySelector(`[data-o="${i.value}"]`).hidden = !i.checked;
    });
    if (state.view) setView(state.view[2], state.view[1], state.view[0]);
    applyLayers();
  });
  window.__map = { viewer, setView, identify, displayZ, fromVp, toVp, state, milesFrom };
})();
</script>
</body>
</html>
