<script>
const BUILD = "202611190047";   // keep equal to build.json
window.relay = (window.Relay || { start() { return this; }, log() {}, warn() {}, error() {} }).start({ page: "ui-sdk-preact", build: BUILD });
// A phone can keep serving a cached copy after a deploy: build.json is fetched past every cache,
// and when it names another build the page reloads once under a URL no cache holds.
fetch("build.json", { cache: "no-store" }).then((r) => r.ok ? r.json() : null).then((b) => {
  if (!b || !b.build || b.build === BUILD) return;
  window.relay.warn("stale page", { running: BUILD, current: b.build });
  let tried = null;
  try { tried = sessionStorage.getItem("ui-sdk-preact:reloaded-for"); sessionStorage.setItem("ui-sdk-preact:reloaded-for", b.build); } catch (e) {}
  if (tried === b.build) return;
  const url = new URL(location.href);
  url.searchParams.set("b", b.build);
  location.replace(url.href);
}).catch(() => {});
</script>
<script type="importmap">
{

  }
}
</script>
