# Matchmaking for Tilt Rally (games/tilt-rally): one Durable Object per room code. Deploy from this folder with
#   CLOUDFLARE_API_TOKEN=... CLOUDFLARE_ACCOUNT_ID=... npx wrangler@4.20.0 deploy
name = "rally-lobby"
main = "index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
