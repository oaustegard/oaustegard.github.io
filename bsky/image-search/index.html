<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="ai-disclosure" content="ai-assisted">
<meta name="description" content="Search 16,878 popular Bluesky images by what is in them; the whole index loads into the page and is searched on your GPU">
<title>Bluesky Image Search</title>
<style>
  @font-face { font-family: "Fraunces"; src: url("/fonts/fraunces-roman.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "DM Sans"; src: url("/fonts/dm-sans.woff2") format("woff2"); font-weight: 100 1000; font-display: swap; }
  @font-face { font-family: "JetBrains Mono"; src: url("/fonts/jetbrains-mono-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  /* Layout: search bar over a grid of image tiles; status line and a method note underneath. */
  :root {
    --bg: #f3f5f8; --surface: #ffffff; --fg: #121a24; --muted: #5b6676; --line: #d8dee7;
    --accent: #0a66d6; --accent-soft: #e3eefc; --bad: #b3261e;
    --display: "Fraunces", Georgia, serif; --body: "DM Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #0d1218; --surface: #151c25; --fg: #e6ebf2; --muted: #93a0b2; --line: #263140;
    --accent: #6aa8f7; --accent-soft: #16273d; --bad: #f2867c; color-scheme: dark } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body);
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px; }
  main { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; }
  .crumb { font: 13px var(--mono); color: var(--muted); }
  .crumb a { color: inherit; }
  h1 { font: 650 clamp(28px, 5vw, 44px)/1.05 var(--display); margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
  .lede { color: var(--muted); max-width: 68ch; margin: 0; }
  form { display: flex; gap: 8px; }
  input[type=search] { flex: 1; min-width: 0; font: 17px var(--body); padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  input[type=search]:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font: 600 15px var(--body); padding: 0 18px; border-radius: 10px; border: 0; background: var(--accent); color: var(--surface); cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; }
  .examples button { background: var(--accent-soft); color: var(--accent); font-weight: 500; padding: 5px 12px; border-radius: 999px; }
  .status { font: 13px var(--mono); color: var(--muted); min-height: 1.5em; }
  .status.bad { color: var(--bad); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; min-width: 0; }
  .tile a.img { display: block; aspect-ratio: 1; background: var(--line); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .meta { display: flex; justify-content: space-between; gap: 6px; padding: 7px 9px; font-size: 12px; color: var(--muted); min-width: 0; }
  .tile .meta a { color: inherit; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .meta span { font-family: var(--mono); font-variant-numeric: tabular-nums; flex: none; }
  .note { font-size: 13px; color: var(--muted); max-width: 75ch; margin: 0; }
  .note a { color: inherit; }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }
</style>
</head>
<body>
<main>
  <header style="display:grid;gap:10px">
    <div class="crumb"><a href="/bsky/">bsky</a> / image search</div>
    <h1>Bluesky Image Search</h1>
    <p class="lede">Search popular Bluesky images by what is in them. Every image was embedded by EmbeddingGemma 2's
      vision encoder and stored as 192 bytes; the whole index loads into this page and is searched on your GPU.</p>
  </header>
  <form id="form">
    <input type="search" id="q" placeholder="loading the index…" autocomplete="off" disabled aria-label="Describe an image">
    <button id="go" disabled>Search</button>
  </form>
  <div class="examples" id="examples"></div>
  <div class="status" id="status">loading…</div>
  <div class="grid" id="grid"></div>
  <p class="note" id="method"></p>
</main>
<script type="module" src="./search.js"></script>
</body>
</html>
