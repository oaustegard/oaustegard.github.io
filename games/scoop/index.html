<style>
/* Layout: one screen. Instruments on top, level and mode buttons under them, the field fills the rest.
   The GPU canvas sits behind everything and takes the board's touches; the HUD only takes its own. */
:root {
  --ink: #0c1a0a;
  --glass: rgba(12, 26, 10, 0.74);
  --rule: #34502a;
  --fg: #eef2e2;
  --dim: #9cae8a;
  --accent: #b8e35a;
  --poop: #c98a4b;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--fg); overflow: hidden;
  overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
body { font: 13px/1.45 var(--mono); }
[hidden] { display: none !important; }
canvas.view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app button { pointer-events: auto; }

#hud { display: grid; grid-template-columns: 76px minmax(0, 1fr) 76px; gap: 12px; align-items: center; }
.pod { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px 7px;
  border: 1px solid var(--rule); border-radius: 10px; background: var(--glass); }
.lbl { font-size: 10px; letter-spacing: 0.16em; color: var(--dim); }
.pod b { font: 800 26px/1 var(--display); font-variant-numeric: tabular-nums; }
#mines b { color: var(--poop); }
#mid { display: flex; flex-direction: column; align-items: center; min-width: 0; }
#title { font: 800 15px/1 var(--display); letter-spacing: 0.32em; color: var(--accent); padding-left: 0.32em; }
#clock { font: 800 44px/1 var(--display); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }

#bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
button { font: 600 12px var(--mono); color: var(--fg); background: var(--glass); border: 1px solid var(--rule);
  border-radius: 999px; padding: 6px 13px; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { color: var(--ink); background: var(--accent); border-color: var(--accent); }
#flagBtn[aria-pressed="true"] { background: #3fbf5f; border-color: #3fbf5f; }
#field { flex: 1; min-height: 0; }
#rail { color: var(--dim); font-size: 11px; text-align: center; text-wrap: balance; }

#overlay { position: fixed; inset: 0; display: grid; place-items: end center; pointer-events: none;
  padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 34px); }
.card { pointer-events: auto; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px;
  padding: 20px 22px; border: 1px solid var(--rule); border-radius: 16px; background: rgba(12, 26, 10, 0.86);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); animation: rise 380ms cubic-bezier(.2,.9,.3,1.2); }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(0.96); } }
.card h2 { font: 800 46px/0.9 var(--display); margin: 0; letter-spacing: 0.03em; }
.card.won h2 { color: #f2cf4a; }
.card.lost h2 { color: var(--poop); }
.card p { margin: 0; color: var(--dim); }
.card p b { color: var(--fg); font-weight: 600; }
.acts { display: flex; gap: 8px; }
.acts .go { flex: 1; }
.go { font: 800 20px var(--display); letter-spacing: 0.12em; padding: 10px 18px; background: var(--accent);
  color: var(--ink); border-color: var(--accent); }
#nogpu { color: var(--poop); }
@media (max-height: 600px) { #clock { font-size: 34px; } .pod b { font-size: 22px; } }
</style>

<body>
<canvas id="gl" class="view" aria-label="Lawn"></canvas>
<canvas id="c2" class="view" aria-label="Lawn" hidden></canvas>

<div id="app">
  <header id="hud">
    <div class="pod" id="mines"><span class="lbl">POOPS</span><b id="mineCount">10</b></div>
    <div id="mid"><div id="title">SCOOP</div><div id="clock">0.0</div></div>
    <div class="pod" id="bestPod"><span class="lbl">BEST</span><b id="best">—</b></div>
  </header>
  <nav id="bar">
    <button data-level="small">9×9</button>
    <button data-level="medium">16×16</button>
    <button data-level="large">30×16</button>
    <button id="flagBtn" aria-pressed="false" title="Taps bag instead of sweep (F)">BAG</button>
    <button id="soundBtn" aria-pressed="true" title="Sound">♪</button>
  </nav>
  <div id="field"></div>
  <div id="rail">tap to sweep · hold or right-click to bag · tap a number to sweep round it<span id="nogpu" hidden> · no WebGPU here, plain view</span></div>
</div>

<div id="overlay" hidden>
  <div class="card" id="card">
    <h2 id="ovTitle"></h2>
    <p id="ovBody"></p>
    <div class="acts"><button class="go" id="againBtn">AGAIN</button><button id="shareBtn" disabled>SHARE</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const Q = new URLSearchParams(location.search);
const DEBUG = Q.has('debug'), OFF = Q.has('offscreen'), NOGPU = Q.has('nogpu');
const $ = id => document.getElementById(id);
const now = () => performance.now() / 1000;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const rand = Q.has('seed') ? mulberry32(+Q.get('seed')) : Math.random;
const fx = Math.random;  // effects never consume the board's seeded stream

/* ---------- rules ---------- */
const LEVELS = { small: { c: 9, r: 9, m: 10 }, medium: { c: 16, r: 16, m: 40 }, large: { c: 30, r: 16, m: 99 } };
const HIDDEN = 0, OPEN = 1, FLAG = 2;
const STEP = 0.03;   // seconds per BFS ring in a flood reveal
let level = LEVELS[store.get('scoop-level')] ? store.get('scoop-level') : 'small';
let C, R, M, N, mine, count, state, revealT, flagT, opened, flagged, status, startT, endT, endKind, boom, hitIdx;
let pings = [], dets = [], flagMode = false, result = null, best = store.get('scoop-best', {}), overlayTimer = 0;

function nbrs(i) {
  const x = i % C, y = (i / C) | 0, out = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && ny >= 0 && nx < C && ny < R) out.push(ny * C + nx);
  }
  return out;
}
function newGame(lv = level) {
  level = lv; store.set('scoop-level', lv);
  const L = LEVELS[lv], f = fieldRect();
  // The wide board stands up on a portrait screen.
  [C, R] = L.c > L.r && f.h > f.w ? [L.r, L.c] : [L.c, L.r];
  M = L.m; N = C * R;
  mine = new Uint8Array(N); count = new Uint8Array(N); state = new Uint8Array(N);
  revealT = new Float32Array(N).fill(-1); flagT = new Float32Array(N);
  opened = 0; flagged = 0; status = 'ready'; startT = 0; endT = 0; endKind = 0; boom = [C / 2, R / 2]; hitIdx = -1;
  pings = []; dets = []; result = null;
  clearTimeout(overlayTimer); $('overlay').hidden = true;
  for (const b of document.querySelectorAll('[data-level]')) {
    const l = LEVELS[b.dataset.level], wide = l.c > l.r && f.h > f.w;
    b.textContent = wide ? `${l.r}×${l.c}` : `${l.c}×${l.r}`;
    b.setAttribute('aria-pressed', String(b.dataset.level === lv));
  }
  if (gpu) gpu.clearParticles();
  layout(); hud();
}
function setCounts() {
  for (let i = 0; i < N; i++) count[i] = nbrs(i).reduce((s, j) => s + mine[j], 0);
}
function placeMines(safe) {
  const keep = new Set([safe, ...(N - 9 >= M ? nbrs(safe) : [])]);
  const pool = [];
  for (let i = 0; i < N; i++) if (!keep.has(i)) pool.push(i);
  for (let k = 0; k < M; k++) { const j = k + Math.floor(rand() * (pool.length - k)); [pool[k], pool[j]] = [pool[j], pool[k]]; mine[pool[k]] = 1; }
  setCounts();
}
function begin(i) {
  if (status !== 'ready') return;
  if (i >= 0) placeMines(i);
  status = 'play'; startT = now();
}
// Breadth-first from the tapped cell; each ring opens STEP later, so a big opening washes outward.
function flood(start, t0) {
  const seen = new Uint8Array(N), q = [start], d = [0], out = [];
  seen[start] = 1;
  for (let h = 0; h < q.length; h++) {
    const i = q[h];
    if (state[i] !== HIDDEN || mine[i]) continue;
    state[i] = OPEN; revealT[i] = t0 + d[h] * STEP; opened++; out.push([i, d[h]]);
    if (count[i] === 0) for (const j of nbrs(i)) if (!seen[j] && state[j] === HIDDEN) { seen[j] = 1; q.push(j); d.push(d[h] + 1); }
  }
  return out;
}
function reveal(i) {
  if (status === 'won' || status === 'lost') return;
  if (state[i] === OPEN) return chord(i);
  if (state[i] !== HIDDEN) return;
  begin(i);
  const t = now();
  ping(i, 1);
  if (mine[i]) return lose(i);
  const out = flood(i, t);
  sfx.sound(out.length);
  if (gpu) gpu.dust(out, t);
  checkWin(i);
  hud();
}
function chord(i) {
  if (status !== 'play' || state[i] !== OPEN || !count[i]) return;
  const ns = nbrs(i);
  if (ns.filter(j => state[j] === FLAG).length !== count[i]) { sfx.dull(); ping(i, 0.35); return; }
  const t = now(), shut = ns.filter(j => state[j] === HIDDEN);
  if (!shut.length) return;
  ping(i, 1);
  const bad = shut.find(j => mine[j]);
  if (bad !== undefined) return lose(bad);
  let out = [];
  for (const j of shut) out = out.concat(flood(j, t));
  sfx.sound(out.length);
  if (gpu) gpu.dust(out, t);
  checkWin(i);
  hud();
}
function toggleFlag(i) {
  if (status === 'won' || status === 'lost') return;
  const t = now();
  if (state[i] === HIDDEN) {
    state[i] = FLAG; flagT[i] = t; flagged++; sfx.mark(); buzz(18);
    if (gpu) gpu.plant(i);
  } else if (state[i] === FLAG) {
    state[i] = HIDDEN; flagT[i] = -t; flagged--; sfx.unmark(); buzz(8);
  } else return chord(i);
  hud();
}
function lose(i) {
  const t = now();
  status = 'lost'; endT = t; endKind = 1; hitIdx = i;
  boom = [i % C + 0.5, ((i / C) | 0) + 0.5];
  // Every unbagged heap turns up, nearest first; the one you stepped in at once.
  const list = [];
  for (let j = 0; j < N; j++) if (mine[j] && state[j] !== FLAG) {
    const d = Math.hypot(j % C + 0.5 - boom[0], ((j / C) | 0) + 0.5 - boom[1]);
    list.push([j, j === i ? 0 : 0.14 + d * 0.085]);
  }
  list.sort((a, b) => a[1] - b[1]);
  let last = 0;
  for (const [j, delay] of list) {
    state[j] = OPEN; revealT[j] = t + delay; last = delay;
    dets.push([t + delay, j === i ? 8 : 1.5]);
    if (gpu) gpu.blast(j, delay, j === i);
  }
  sfx.blasts(list.map(e => e[1]));
  buzz([60, 40, 120]);
  hud();
  showOverlay(last + 0.9);
}
function checkWin(i) {
  if (opened !== N - M) return;
  const t = now();
  status = 'won'; endT = t; endKind = 2;
  boom = [i % C + 0.5, ((i / C) | 0) + 0.5];
  const secs = t - startT, prev = best[level];
  // The wave bags whatever is left as it passes.
  for (let j = 0; j < N; j++) if (mine[j]) {
    const d = Math.hypot(j % C + 0.5 - boom[0], ((j / C) | 0) + 0.5 - boom[1]);
    if (state[j] !== FLAG) { state[j] = FLAG; flagT[j] = t + d / 12; flagged++; }
    if (gpu) gpu.rise(j, d / 12);
  }
  if (!prev || secs < prev) { best[level] = secs; store.set('scoop-best', best); }
  sfx.win(); buzz([20, 60, 20, 60, 40]);
  result = { secs, prev, record: !prev || secs < prev };
  hud();
  showOverlay(1.4);
}
function ping(i, amp) {
  pings.push([i % C + 0.5, ((i / C) | 0) + 0.5, now(), amp]);
  if (pings.length > 8) pings.shift();
}

/* ---------- HUD ---------- */
const fmt = s => s.toFixed(1);
function hud() {
  $('mineCount').textContent = String(M - flagged);
  $('best').textContent = best[level] ? fmt(best[level]) : '—';
  if (status === 'won') {
    $('card').className = 'card won';
    $('ovTitle').textContent = 'LAWN CLEAN';
    const { secs, prev, record } = result;
    $('ovBody').innerHTML = `<b>${fmt(secs)} s</b> ` + (record ? (prev ? `· new best, was ${fmt(prev)}` : '· first clean lawn this size') : `· best ${fmt(best[level])}`);
  } else if (status === 'lost') {
    $('card').className = 'card lost';
    $('ovTitle').textContent = 'YOU STEPPED IN IT';
    const left = N - M - opened;
    $('ovBody').innerHTML = `<b>${left}</b> patch${left === 1 ? '' : 'es'} of grass still unswept.`;
  }
}
function showOverlay(delay) {
  clearTimeout(overlayTimer);
  setTimeout(applyUpdate, delay * 1000 + 50);
  overlayTimer = setTimeout(() => { buildShare(); $('overlay').hidden = false; $('againBtn').focus({ preventScroll: true }); }, delay * 1000);
}
function tickClock() {
  const s = status === 'play' ? now() - startT : status === 'ready' ? 0 : endT - startT;
  const txt = fmt(Math.min(s, 999.9));
  if ($('clock').textContent !== txt) $('clock').textContent = txt;
}

/* ---------- layout ---------- */
let dpr = 1, cellCss = 32, orgCss = [0, 0];
function fieldRect() { const r = $('field').getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; }
function layout() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  for (const cv of [$('gl'), $('c2')]) { cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr); }
  const f = fieldRect(), pad = 10;
  cellCss = Math.max(12, Math.min(64, Math.floor(Math.min((f.w - pad * 2) / C, (f.h - pad * 2) / R))));
  orgCss = [Math.round(f.x + (f.w - cellCss * C) / 2), Math.round(f.y + (f.h - cellCss * R) / 2)];
  if (gpu) gpu.resize();
}
addEventListener('resize', () => { if (C) layout(); });

/* ---------- input ---------- */
let press = null, hover = [-10, -10], light = null;
function cellAt(e) {
  const x = Math.floor((e.clientX - orgCss[0]) / cellCss), y = Math.floor((e.clientY - orgCss[1]) / cellCss);
  return x >= 0 && y >= 0 && x < C && y < R ? y * C + x : -1;
}
function onDown(e) {
  if (!e.target.classList.contains('view')) return;
  unlockAudio();
  const i = cellAt(e);
  light = [(e.clientX - orgCss[0]) / cellCss, (e.clientY - orgCss[1]) / cellCss];
  if (i < 0) return;
  if (e.button === 2) { toggleFlag(i); return; }
  if (e.button !== 0) return;
  press = { id: e.pointerId, i, x: e.clientX, y: e.clientY, done: false,
    timer: setTimeout(() => { if (press) { press.done = true; toggleFlag(press.i); } }, 380) };
}
function onMove(e) {
  const lx = (e.clientX - orgCss[0]) / cellCss, ly = (e.clientY - orgCss[1]) / cellCss;
  if (e.pointerType === 'mouse') hover = [lx, ly];
  if (e.pointerType === 'mouse' || press) light = [lx, ly];
  if (press && e.pointerId === press.id && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 12) { clearTimeout(press.timer); press = null; }
}
function onUp(e) {
  if (!press || e.pointerId !== press.id) return;
  clearTimeout(press.timer);
  const p = press; press = null;
  if (p.done) return;
  if (flagMode && state[p.i] !== OPEN) toggleFlag(p.i); else reveal(p.i);
}
addEventListener('pointerdown', onDown);
addEventListener('pointermove', onMove);
addEventListener('pointerup', onUp);
addEventListener('pointercancel', () => { if (press) clearTimeout(press.timer); press = null; });
addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hover = [-10, -10]; });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') newGame();
  else if (e.key === 'f' || e.key === 'F') setFlagMode(!flagMode);
  else if (e.key === ' ' && hover[0] >= 0) {
    e.preventDefault();
    const x = Math.floor(hover[0]), y = Math.floor(hover[1]);
    if (x < C && y < R) toggleFlag(y * C + x);
  }
});
function setFlagMode(on) { flagMode = on; $('flagBtn').setAttribute('aria-pressed', String(on)); }
for (const b of document.querySelectorAll('[data-level]')) b.addEventListener('click', () => newGame(b.dataset.level));
$('flagBtn').addEventListener('click', () => setFlagMode(!flagMode));
$('againBtn').addEventListener('click', () => newGame());
$('shareBtn').addEventListener('click', share);
$('soundBtn').addEventListener('click', () => {
  sfx.on = !sfx.on; store.set('scoop-sound', sfx.on);
  $('soundBtn').setAttribute('aria-pressed', String(sfx.on)); if (sfx.on) unlockAudio();
});

/* ---------- sound and haptics ---------- */
let actx = null;
// iOS mutes Web Audio on the silent switch unless the page asks for playback (see Plumb's notes).
function unlockAudio() {
  if (!sfx.on) return;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state !== 'running') actx.resume();
    const src = actx.createBufferSource();
    src.buffer = actx.createBuffer(1, 1, 22050); src.connect(actx.destination); src.start(0);
  } catch {}
}
// iOS (every browser there is WebKit) only lets audio start inside a user gesture, and a touch
// pointerdown is not one: touchend, pointerup and click are. Try on each until the context runs.
for (const ev of ['pointerup', 'touchend', 'click', 'keydown']) {
  addEventListener(ev, () => { if (!actx || actx.state !== 'running') unlockAudio(); }, true);
}
let noiseBuf = null;
function tone(freq, dur, { type = 'sine', vol = 0.06, slide = 1, at = 0 } = {}) {
  if (!sfx.on || !actx) return;
  const t = actx.currentTime + at, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide !== 1) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(at, vol, dur, type, f0, f1, q = 1) {
  if (!sfx.on || !actx) return;
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 1.5, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = actx.currentTime + at, src = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = noiseBuf; fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

// Board pass: one full-screen triangle. Every pixel finds its cell, reads that cell's state from a
// storage buffer (state, reveal time, mark time, count) and shades it analytically: swaying grass
// tufts lit by a moving sun spot, mown lawn, glyph-atlas numbers, poop with stink lines, tied bags,
// gust rings, the rolling stink wave and the win wave. Nothing is pre-rendered, so every animation is
// a function of time and the per-cell timestamps the rules write.
const BOARD_WGSL = /* wgsl */`
@group(0) @binding(0) var<uniform> U: array<vec4f, 13>;
@group(0) @binding(1) var<storage, read> cells: array<vec4f>;
@group(0) @binding(2) var glyphs: texture_2d<f32>;
@group(0) @binding(3) var samp: sampler;

struct VO { @builtin(position) pos: vec4f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  var o: VO; o.pos = vec4f(p[i], 0.0, 1.0); return o;
}
fn hash2(p: vec2f) -> f32 { return fract(sin(dot(p, vec2f(127.1, 311.7))) * 43758.5453); }
fn sdBox(p: vec2f, b: vec2f, r: f32) -> f32 {
  let q = abs(p) - b + vec2f(r);
  return length(max(q, vec2f(0.0))) + min(max(q.x, q.y), 0.0) - r;
}
fn sdEll(p: vec2f, c: vec2f, r: vec2f) -> f32 { return (length((p - c) / r) - 1.0) * min(r.x, r.y); }
fn smin(a: f32, b: f32, k: f32) -> f32 { let h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
fn cellAt(c: vec2i) -> vec4f {

}
fn numCol(n: i32) -> vec3f {
  switch n {
    case 1: { return vec3f(0.08, 0.22, 0.72); }
    case 2: { return vec3f(0.05, 0.4, 0.08); }
    case 3: { return vec3f(0.72, 0.08, 0.06); }
    case 4: { return vec3f(0.3, 0.08, 0.52); }
    case 5: { return vec3f(0.5, 0.14, 0.04); }
    case 6: { return vec3f(0.0, 0.4, 0.4); }
    case 7: { return vec3f(0.08, 0.08, 0.08); }

// Sunlight dappled through leaves, around the lawn.
fn caustic(uv: vec2f, time: f32) -> f32 {
  let p = uv * 6.28318 - vec2f(250.0);
  var i = p; var c = 1.0; let inten = 0.005;
  for (var n = 0; n < 4; n++) {
    let tt = time * (1.0 - (3.5 / f32(n + 1)));
    i = p + vec2f(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2f(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c = 1.17 - pow(c / 4.0, 1.4);
  return pow(abs(c), 8.0);
}
// 0 before the win wave reaches pos, 1 after.
fn winMix(pos: vec2f) -> f32 {
  if (U[3].y != 2.0) { return 0.0; }
  return smoothstep(0.0, 1.5, (U[1].y - U[3].x) * 12.0 - length(pos - U[3].zw));
}

// A soft-serve swirl: four stacked tiers drawn bottom up, each creased where it sits on the one below.
fn poop(col0: vec3f, f: vec2f, Ld: vec3f, aa: f32, sc: vec2f) -> vec3f {
  var col = col0;
  var tiers = array<vec4f, 4>(vec4f(0.0, 0.17, 0.3, 0.11), vec4f(-0.01, 0.05, 0.22, 0.09),
                              vec4f(0.012, -0.06, 0.145, 0.075), vec4f(0.05, -0.15, 0.05, 0.065));
  let p = f / sc;

  let H = normalize(Ld + vec3f(0.0, 0.0, 1.0));

// A tied plastic bag: pear-shaped body, pinched neck, two knot ears flared out, crinkled and shiny.
fn rot(p: vec2f, a: f32) -> vec2f { let c = cos(a); let s = sin(a); return vec2f(c * p.x + s * p.y, -s * p.x + c * p.y); }

}

fn tile(p: vec2f, aa: f32) -> vec3f {

      for (var j = 0; j < 5; j++) {

      }

    } else {
      let wob = 1.0 + 0.3 * exp(-age * 8.0) * sin(age * 34.0);
      col = poop(col, f, Ld, aa, vec2f(0.9 / wob, 0.9 * wob));
    }

      let line = smoothstep(0.02, 0.007, abs(f.x - wx)) * smoothstep(-0.49, -0.38, f.y) * smoothstep(-0.18, -0.28, f.y);
      let flick = 0.55 + 0.45 * sin(t * 3.0 + f32(i) * 2.1 + seed * 6.0);
      col = mix(col, vec3f(0.5, 0.66, 0.16), line * 0.8 * flick * min(age * 3.0, 1.0));

      let o = vec2i(dx, dy);

    let gy = sdBox(f + vec2f(0.0, eps), vec2f(hs), rad) - sdBox(f - vec2f(0.0, eps), vec2f(hs), rad);
    let bev = smoothstep(-0.16 * e - 0.001, 0.0, d);

    let dif = max(dot(Nc, Ld), 0.0);

    let bp = vec2f(f.x * 18.0 + sway + seed * 13.0, f.y * 3.5 + seed * 5.0);

    if (endK == 1.0 && t > endT) { cc = mix(cc, cc * vec3f(0.95, 0.92, 0.6), min((t - endT) * 0.8, 0.5)); }

    // A bag on a marked tuft: dropped in with a couple of bounces.

      let drop = -0.55 * exp(-age * 7.0) * abs(cos(age * 16.0));
      let tint = mix(vec3f(0.12, 0.56, 0.2), vec3f(0.95, 0.78, 0.22), wm);

        let cross = smoothstep(0.05, 0.03, min(abs(f.x - f.y), abs(f.x + f.y)) * 0.7071) * step(max(abs(f.x), abs(f.y)), 0.3);

@fragment fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let res = U[0].xy; let org = U[0].zw; let cs = U[1].x; let t = U[1].y;
  let C = U[1].z; let R = U[1].w;
  let endT = U[3].x; let endK = U[3].y; let boom = U[3].zw;
  var p = (fc.xy - org) / cs;
  // The stink rolls across the lawn as a wobbling ring.
  if (endK == 1.0 && t > endT) {
    let age = t - endT; let dv = p - boom; let r = length(dv) + 1e-4;
    let w = exp(-pow((r - age * 9.0) * 0.7, 2.0)) * exp(-age * 1.1);
    p -= dv / r * w * 0.3 * (0.7 + 0.3 * sin(atan2(dv.y, dv.x) * 6.0 + age * 10.0));
  }

  let uv = fc.xy / res;

  col += vec3f(0.22, 0.26, 0.08) * min(caustic(fc.xy / max(res.x, res.y) * 1.6, t * 0.25), 1.5) * 0.6;
  let hb = vec2f(C, R) * 0.5;

  col *= 1.0 - 0.6 * exp(-max(bd, 0.0) * 1.4) * step(0.0, bd);
  let grain = 0.88 + 0.12 * sin(p.y * 26.0 + sin(p.x * 2.3) * 5.0);
  col = mix(col, vec3f(0.32, 0.21, 0.11) * grain, smoothstep(aa, -aa, bd));
  col += vec3f(0.45, 0.33, 0.17) * exp(-abs(bd) * cs / 1.4) * 0.4;
  if (p.x >= 0.0 && p.y >= 0.0 && p.x < C && p.y < R) { col = tile(p, aa); }

  // A gust ring from each sweep.
  var a = 0.0;
  for (var i = 4; i < 12; i++) {
    let q = U[i];
    if (q.w <= 0.0) { continue; }
    let age = t - q.z;
    if (age < 0.0 || age > 3.0) { continue; }
    let d = length(p - q.xy);
    a += exp(-pow((d - age * 10.0) * 2.4, 2.0)) * exp(-age * 1.8) * q.w;
  }
  col += vec3f(1.0, 1.0, 0.85) * a * 0.18 * smoothstep(0.6, -0.2, bd);
  if (endK == 2.0) {
    let age = t - endT;
    let d = length(p - boom);
    col += vec3f(1.0, 0.85, 0.35) * exp(-pow((d - age * 12.0) * 1.6, 2.0)) * exp(-age * 0.6) * 0.4 * smoothstep(0.6, -0.2, bd);
  }
  if (endK == 1.0 && t > endT) { col += vec3f(0.25, 0.3, 0.0) * exp(-(t - endT) * 3.5); }
  let v = uv - vec2f(0.5);
  col *= 1.0 - dot(v, v) * 0.8;
  return vec4f(col, 1.0);
}`;

// Particles: a ring buffer of 32768. Each record is position and velocity in cell units, age, life,
// size, kind and colour. A negative age is a delay, so a whole chain of blasts is written at once and

    const goal = light || idle;
    lit = lit || goal.slice();
    lit[0] += (goal[0] - lit[0]) * Math.min(1, dt * 6); lit[1] += (goal[1] - lit[1]) * Math.min(1, dt * 6);
    let shake = 0;
    for (const [dt0, amp] of dets) { const a = t - dt0; if (a >= 0 && a < 0.8) shake += amp * Math.exp(-a * 9); }
    shake = Math.min(shake, 18) * dpr;
    const W = $('gl').width, H = $('gl').height;
    U.fill(0);
    U.set([W, H, orgCss[0] * dpr + (fx() - 0.5) * shake, orgCss[1] * dpr + (fx() - 0.5) * shake], 0);
    U.set([cellCss * dpr, t, C, R], 4);
    U.set([lit[0], lit[1], hover[0], hover[1]], 8);
    U.set([endT, endKind, boom[0], boom[1]], 12);
    pings.forEach((p, k) => U.set(p, 16 + k * 4));
    U.set([flagMode ? 1 : 0, dpr, Math.max(C, R) * 0.32, 0], 48);
    if (cellData.length !== N * 4) cellData = new Float32Array(N * 4);
    for (let i = 0; i < N; i++) {
      const o = i * 4;
      cellData[o] = state[i]; cellData[o + 1] = revealT[i]; cellData[o + 2] = flagT[i];
      cellData[o + 3] = mine[i] ? (i === hitIdx ? 10 : 9) : count[i];
    }
    gpu.frame(t, dt, U, cellData);
  } else draw2d(t);
  requestAnimationFrame(frame);
}

if (DEBUG) {
  window.__scoop = {
    state: () => ({ status, C, R, M, opened, flagged, renderer: gpu ? 'webgpu' : '2d', level }),
    cell: (x, y) => { const i = y * C + x; return { state: state[i], mine: mine[i], count: count[i] }; },
    setMines(list) {
      mine.fill(0); for (const [x, y] of list) mine[y * C + x] = 1;
      M = list.length; setCounts(); status = 'play'; startT = now(); hud();
    },
    reveal: (x, y) => reveal(y * C + x), flag: (x, y) => toggleFlag(y * C + x), chord: (x, y) => chord(y * C + x),
    newGame, layout: () => ({ cellCss, orgCss, dpr }),
  };
}

(async () => {
  try { await Promise.race([document.fonts.load('800 64px "Big Shoulders Display"'), new Promise(r => setTimeout(r, 1500))]); } catch {}
  gpu = await initGPU();
  if (!gpu || OFF) { useFallback(); if (OFF && gpu) $('nogpu').hidden = true; }
  newGame(level);
  requestAnimationFrame(frame);
})();
/* Updates, as in Plumb: a home-screen app usually resumes rather than reloads, so ask the service worker
   to check on every return to the foreground and every 30 minutes, and reload into a new version only
   while no game is in progress. */
let updateReady = false, swReg = null;
function applyUpdate() { if (updateReady && status !== 'play') location.reload(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && swReg) swReg.update().catch(() => {}); });
if ('serviceWorker' in navigator && isSecureContext && location.hostname !== 'localhost') {
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) { hadController = true; return; }
    updateReady = true; applyUpdate();
  });
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(r => { swReg = r; setInterval(() => r.update().catch(() => {}), 30 * 60 * 1000); })
      .catch(() => {});
  });
}
})();
</script>
