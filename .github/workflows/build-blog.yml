# build-blog.yml: Regenerate everything the site lists from the pages on disk:
# feed.xml, blog/index.html, data/tools.json, tools.html, the seven district pages
# and the generated regions of index.html. The file keeps its old name; the workflow
# is "Build site", and deploy.yml listens for that exact name.
#
# The push below uses GITHUB_TOKEN, so it does not start push workflows. That is why
# deploy.yml also runs on workflow_run of this workflow.
name: Build site

on:
  push:
    branches: ["main"]
    paths:
      - "blog/*.html"
      - "blog/_config.json"
      - "scripts/build_*.py"
      - "data/tool-notes.json"
      - "ai-tools/*.html"
      - "ai-tools/*/index.html"
      - "biking/*.html"
      - "biking/*/index.html"
      - "bsky/*.html"
      - "bsky/*/index.html"
      - "deepzoom/*.html"
      - "deepzoom/*/index.html"
      - "fun-and-games/*.html"
      - "fun-and-games/*/index.html"
      - "web-utilities/*.html"
      - "web-utilities/*/index.html"
      - "etc/*.html"
      - "etc/*/index.html"
      - "found/*.html"
      # generated, so a commit of them must not start a run
      - "!blog/index.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate listings
        run: python3 scripts/build_site.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml blog/index.html data/tools.json tools.html index.html \
            ai-tools/index.html biking/index.html bsky/index.html deepzoom/index.html \
            etc/index.html fun-and-games/index.html web-utilities/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate listings: feed, blog index, tool lists, home page"
            git push
          fi
