<style>
/* Layout: one screen. Instruments on top, level and mode buttons under them, the field fills the rest.
   The GPU canvas sits behind everything and takes the board's touches; the HUD only takes its own. */
:root {
  --ink: #06121a;
  --glass: rgba(6, 18, 26, 0.72);
  --rule: #1d3a48;
  --fg: #e4f0f0;
  --dim: #7f9ea8;
  --sonar: #5fd4f0;
  --beacon: #ff7a4a;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--fg); overflow: hidden;
  overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
body { font: 13px/1.45 var(--mono); }
[hidden] { display: none !important; }
canvas.view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app button { pointer-events: auto; }

#hud { display: grid; grid-template-columns: 76px minmax(0, 1fr) 76px; gap: 12px; align-items: center; }
.pod { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px 7px;
  border: 1px solid var(--rule); border-radius: 10px; background: var(--glass); }
.lbl { font-size: 10px; letter-spacing: 0.16em; color: var(--dim); }
.pod b { font: 800 26px/1 var(--display); font-variant-numeric: tabular-nums; }
#mines b { color: var(--beacon); }
#mid { display: flex; flex-direction: column; align-items: center; min-width: 0; }
#title { font: 800 15px/1 var(--display); letter-spacing: 0.32em; color: var(--sonar); padding-left: 0.32em; }
#clock { font: 800 44px/1 var(--display); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }

#bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
button { font: 600 12px var(--mono); color: var(--fg); background: var(--glass); border: 1px solid var(--rule);
  border-radius: 999px; padding: 6px 13px; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--sonar); outline-offset: 2px; }
button[aria-pressed="true"] { color: var(--ink); background: var(--sonar); border-color: var(--sonar); }
#flagBtn[aria-pressed="true"] { background: var(--beacon); border-color: var(--beacon); }
#field { flex: 1; min-height: 0; }
#rail { color: var(--dim); font-size: 11px; text-align: center; text-wrap: balance; }

#overlay { position: fixed; inset: 0; display: grid; place-items: end center; pointer-events: none;
  padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 34px); }
.card { pointer-events: auto; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px;
  padding: 20px 22px; border: 1px solid var(--rule); border-radius: 16px; background: rgba(6, 18, 26, 0.84);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); animation: rise 380ms cubic-bezier(.2,.9,.3,1.2); }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(0.96); } }
.card h2 { font: 800 46px/0.9 var(--display); margin: 0; letter-spacing: 0.03em; }
.card.won h2 { color: #6ff0c0; }
.card.lost h2 { color: var(--beacon); }
.card p { margin: 0; color: var(--dim); }
.card p b { color: var(--fg); font-weight: 600; }
.acts { display: flex; gap: 8px; }
.acts .go { flex: 1; }
.go { font: 800 20px var(--display); letter-spacing: 0.12em; padding: 10px 18px; background: var(--sonar);
  color: var(--ink); border-color: var(--sonar); }
#nogpu { color: var(--beacon); }
@media (max-height: 600px) { #clock { font-size: 34px; } .pod b { font-size: 22px; } }
</style>

<body>
<canvas id="gl" class="view" aria-label="Minefield"></canvas>
<canvas id="c2" class="view" aria-label="Minefield" hidden></canvas>

<div id="app">
  <header id="hud">
    <div class="pod" id="mines"><span class="lbl">MINES</span><b id="mineCount">10</b></div>
    <div id="mid"><div id="title">SOUNDING</div><div id="clock">0.0</div></div>
    <div class="pod" id="bestPod"><span class="lbl">BEST</span><b id="best">—</b></div>
  </header>
  <nav id="bar">
    <button data-level="small">9×9</button>
    <button data-level="medium">16×16</button>
    <button data-level="large">30×16</button>
    <button id="flagBtn" aria-pressed="false" title="Taps mark instead of sound (F)">MARK</button>
    <button id="soundBtn" aria-pressed="true" title="Sound">♪</button>
  </nav>
  <div id="field"></div>
  <div id="rail">tap to sound · hold or right-click to mark · tap a number to clear round it<span id="nogpu" hidden> · no WebGPU here, plain view</span></div>
</div>

<div id="overlay" hidden>
  <div class="card" id="card">
    <h2 id="ovTitle"></h2>
    <p id="ovBody"></p>
    <div class="acts"><button class="go" id="againBtn">AGAIN</button><button id="shareBtn" disabled>SHARE</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const Q = new URLSearchParams(location.search);
const DEBUG = Q.has('debug'), OFF = Q.has('offscreen'), NOGPU = Q.has('nogpu');
const $ = id => document.getElementById(id);
const now = () => performance.now() / 1000;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const rand = Q.has('seed') ? mulberry32(+Q.get('seed')) : Math.random;
const fx = Math.random;  // effects never consume the board's seeded stream

/* ---------- rules ---------- */
const LEVELS = { small: { c: 9, r: 9, m: 10 }, medium: { c: 16, r: 16, m: 40 }, large: { c: 30, r: 16, m: 99 } };
const HIDDEN = 0, OPEN = 1, FLAG = 2;
const STEP = 0.03;   // seconds per BFS ring in a flood reveal
let level = LEVELS[store.get('sounding-level')] ? store.get('sounding-level') : 'small';
let C, R, M, N, mine, count, state, revealT, flagT, opened, flagged, status, startT, endT, endKind, boom, hitIdx;
let pings = [], dets = [], flagMode = false, result = null, best = store.get('sounding-best', {}), overlayTimer = 0;

function nbrs(i) {
  const x = i % C, y = (i / C) | 0, out = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && ny >= 0 && nx < C && ny < R) out.push(ny * C + nx);
  }
  return out;
}
function newGame(lv = level) {
  level = lv; store.set('sounding-level', lv);
  const L = LEVELS[lv], f = fieldRect();
  // The wide board stands up on a portrait screen.
  [C, R] = L.c > L.r && f.h > f.w ? [L.r, L.c] : [L.c, L.r];
  M = L.m; N = C * R;
  mine = new Uint8Array(N); count = new Uint8Array(N); state = new Uint8Array(N);
  revealT = new Float32Array(N).fill(-1); flagT = new Float32Array(N);
  opened = 0; flagged = 0; status = 'ready'; startT = 0; endT = 0; endKind = 0; boom = [C / 2, R / 2]; hitIdx = -1;
  pings = []; dets = []; result = null;
  clearTimeout(overlayTimer); $('overlay').hidden = true;
  for (const b of document.querySelectorAll('[data-level]')) {
    const l = LEVELS[b.dataset.level], wide = l.c > l.r && f.h > f.w;
    b.textContent = wide ? `${l.r}×${l.c}` : `${l.c}×${l.r}`;
    b.setAttribute('aria-pressed', String(b.dataset.level === lv));
  }
  if (gpu) gpu.clearParticles();
  layout(); hud();
}
function setCounts() {
  for (let i = 0; i < N; i++) count[i] = nbrs(i).reduce((s, j) => s + mine[j], 0);
}
function placeMines(safe) {
  const keep = new Set([safe, ...(N - 9 >= M ? nbrs(safe) : [])]);
  const pool = [];
  for (let i = 0; i < N; i++) if (!keep.has(i)) pool.push(i);
  for (let k = 0; k < M; k++) { const j = k + Math.floor(rand() * (pool.length - k)); [pool[k], pool[j]] = [pool[j], pool[k]]; mine[pool[k]] = 1; }
  setCounts();
}
function begin(i) {
  if (status !== 'ready') return;
  if (i >= 0) placeMines(i);
  status = 'play'; startT = now();
}
// Breadth-first from the tapped cell; each ring opens STEP later, so a big opening washes outward.
function flood(start, t0) {
  const seen = new Uint8Array(N), q = [start], d = [0], out = [];
  seen[start] = 1;
  for (let h = 0; h < q.length; h++) {
    const i = q[h];
    if (state[i] !== HIDDEN || mine[i]) continue;
    state[i] = OPEN; revealT[i] = t0 + d[h] * STEP; opened++; out.push([i, d[h]]);
    if (count[i] === 0) for (const j of nbrs(i)) if (!seen[j] && state[j] === HIDDEN) { seen[j] = 1; q.push(j); d.push(d[h] + 1); }
  }
  return out;
}
function reveal(i) {
  if (status === 'won' || status === 'lost') return;
  if (state[i] === OPEN) return chord(i);
  if (state[i] !== HIDDEN) return;
  begin(i);
  const t = now();
  ping(i, 1);
  if (mine[i]) return lose(i);
  const out = flood(i, t);
  sfx.sound(out.length);
  if (gpu) gpu.dust(out, t);
  checkWin(i);
  hud();
}
function chord(i) {
  if (status !== 'play' || state[i] !== OPEN || !count[i]) return;
  const ns = nbrs(i);
  if (ns.filter(j => state[j] === FLAG).length !== count[i]) { sfx.dull(); ping(i, 0.35); return; }
  const t = now(), shut = ns.filter(j => state[j] === HIDDEN);
  if (!shut.length) return;
  ping(i, 1);
  const bad = shut.find(j => mine[j]);
  if (bad !== undefined) return lose(bad);
  let out = [];
  for (const j of shut) out = out.concat(flood(j, t));
  sfx.sound(out.length);
  if (gpu) gpu.dust(out, t);
  checkWin(i);
  hud();
}
function toggleFlag(i) {
  if (status === 'won' || status === 'lost') return;
  const t = now();
  if (state[i] === HIDDEN) {
    state[i] = FLAG; flagT[i] = t; flagged++; sfx.mark(); buzz(18);
    if (gpu) gpu.plant(i);
  } else if (state[i] === FLAG) {
    state[i] = HIDDEN; flagT[i] = -t; flagged--; sfx.unmark(); buzz(8);
  } else return chord(i);
  hud();
}
function lose(i) {
  const t = now();
  status = 'lost'; endT = t; endKind = 1; hitIdx = i;
  boom = [i % C + 0.5, ((i / C) | 0) + 0.5];
  // Every unmarked mine goes up, nearest first; the one you hit goes at once.
  const list = [];
  for (let j = 0; j < N; j++) if (mine[j] && state[j] !== FLAG) {
    const d = Math.hypot(j % C + 0.5 - boom[0], ((j / C) | 0) + 0.5 - boom[1]);
    list.push([j, j === i ? 0 : 0.14 + d * 0.085]);
  }
  list.sort((a, b) => a[1] - b[1]);
  let last = 0;
  for (const [j, delay] of list) {
    state[j] = OPEN; revealT[j] = t + delay; last = delay;
    dets.push([t + delay, j === i ? 14 : 5]);
    if (gpu) gpu.blast(j, delay, j === i);
  }
  sfx.blasts(list.map(e => e[1]));
  buzz([60, 40, 120]);
  hud();
  showOverlay(last + 0.9);
}
function checkWin(i) {
  if (opened !== N - M) return;
  const t = now();
  status = 'won'; endT = t; endKind = 2;
  boom = [i % C + 0.5, ((i / C) | 0) + 0.5];
  const secs = t - startT, prev = best[level];
  // The leftover mines are marked by the wave as it passes them.
  for (let j = 0; j < N; j++) if (mine[j]) {
    const d = Math.hypot(j % C + 0.5 - boom[0], ((j / C) | 0) + 0.5 - boom[1]);
    if (state[j] !== FLAG) { state[j] = FLAG; flagT[j] = t + d / 12; flagged++; }
    if (gpu) gpu.rise(j, d / 12);
  }
  if (!prev || secs < prev) { best[level] = secs; store.set('sounding-best', best); }
  sfx.win(); buzz([20, 60, 20, 60, 40]);
  result = { secs, prev, record: !prev || secs < prev };
  hud();
  showOverlay(1.4);
}
function ping(i, amp) {
  pings.push([i % C + 0.5, ((i / C) | 0) + 0.5, now(), amp]);
  if (pings.length > 8) pings.shift();
}

/* ---------- HUD ---------- */
const fmt = s => s.toFixed(1);
function hud() {
  $('mineCount').textContent = String(M - flagged);
  $('best').textContent = best[level] ? fmt(best[level]) : '—';
  if (status === 'won') {
    $('card').className = 'card won';
    $('ovTitle').textContent = 'FIELD CLEARED';
    const { secs, prev, record } = result;
    $('ovBody').innerHTML = `<b>${fmt(secs)} s</b> ` + (record ? (prev ? `· new best, was ${fmt(prev)}` : '· first clear on this field') : `· best ${fmt(best[level])}`);
  } else if (status === 'lost') {
    $('card').className = 'card lost';
    $('ovTitle').textContent = 'STRUCK A MINE';
    const left = N - M - opened;
    $('ovBody').innerHTML = `<b>${left}</b> safe cell${left === 1 ? '' : 's'} still closed.`;
  }
}
function showOverlay(delay) {
  clearTimeout(overlayTimer);
  setTimeout(applyUpdate, delay * 1000 + 50);
  overlayTimer = setTimeout(() => { buildShare(); $('overlay').hidden = false; $('againBtn').focus({ preventScroll: true }); }, delay * 1000);
}
function tickClock() {
  const s = status === 'play' ? now() - startT : status === 'ready' ? 0 : endT - startT;
  const txt = fmt(Math.min(s, 999.9));
  if ($('clock').textContent !== txt) $('clock').textContent = txt;
}

/* ---------- layout ---------- */
let dpr = 1, cellCss = 32, orgCss = [0, 0];
function fieldRect() { const r = $('field').getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; }
function layout() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  for (const cv of [$('gl'), $('c2')]) { cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr); }
  const f = fieldRect(), pad = 10;
  cellCss = Math.max(12, Math.min(64, Math.floor(Math.min((f.w - pad * 2) / C, (f.h - pad * 2) / R))));
  orgCss = [Math.round(f.x + (f.w - cellCss * C) / 2), Math.round(f.y + (f.h - cellCss * R) / 2)];
  if (gpu) gpu.resize();
}
addEventListener('resize', () => { if (C) layout(); });

/* ---------- input ---------- */
let press = null, hover = [-10, -10], light = null;
function cellAt(e) {
  const x = Math.floor((e.clientX - orgCss[0]) / cellCss), y = Math.floor((e.clientY - orgCss[1]) / cellCss);
  return x >= 0 && y >= 0 && x < C && y < R ? y * C + x : -1;
}
function onDown(e) {
  if (!e.target.classList.contains('view')) return;
  unlockAudio();
  const i = cellAt(e);
  light = [(e.clientX - orgCss[0]) / cellCss, (e.clientY - orgCss[1]) / cellCss];
  if (i < 0) return;
  if (e.button === 2) { toggleFlag(i); return; }
  if (e.button !== 0) return;
  press = { id: e.pointerId, i, x: e.clientX, y: e.clientY, done: false,
    timer: setTimeout(() => { if (press) { press.done = true; toggleFlag(press.i); } }, 380) };
}
function onMove(e) {
  const lx = (e.clientX - orgCss[0]) / cellCss, ly = (e.clientY - orgCss[1]) / cellCss;
  if (e.pointerType === 'mouse') hover = [lx, ly];
  if (e.pointerType === 'mouse' || press) light = [lx, ly];
  if (press && e.pointerId === press.id && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 12) { clearTimeout(press.timer); press = null; }
}
function onUp(e) {
  if (!press || e.pointerId !== press.id) return;
  clearTimeout(press.timer);
  const p = press; press = null;
  if (p.done) return;
  if (flagMode && state[p.i] !== OPEN) toggleFlag(p.i); else reveal(p.i);
}
addEventListener('pointerdown', onDown);
addEventListener('pointermove', onMove);
addEventListener('pointerup', onUp);
addEventListener('pointercancel', () => { if (press) clearTimeout(press.timer); press = null; });
addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hover = [-10, -10]; });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') newGame();
  else if (e.key === 'f' || e.key === 'F') setFlagMode(!flagMode);
  else if (e.key === ' ' && hover[0] >= 0) {
    e.preventDefault();
    const x = Math.floor(hover[0]), y = Math.floor(hover[1]);
    if (x < C && y < R) toggleFlag(y * C + x);
  }
});
function setFlagMode(on) { flagMode = on; $('flagBtn').setAttribute('aria-pressed', String(on)); }
for (const b of document.querySelectorAll('[data-level]')) b.addEventListener('click', () => newGame(b.dataset.level));
$('flagBtn').addEventListener('click', () => setFlagMode(!flagMode));
$('againBtn').addEventListener('click', () => newGame());
$('shareBtn').addEventListener('click', share);
$('soundBtn').addEventListener('click', () => {
  sfx.on = !sfx.on; store.set('sounding-sound', sfx.on);
  $('soundBtn').setAttribute('aria-pressed', String(sfx.on)); if (sfx.on) unlockAudio();
});

/* ---------- sound and haptics ---------- */
let actx = null;
// iOS mutes Web Audio on the silent switch unless the page asks for playback (see Plumb's notes).
function unlockAudio() {
  if (!sfx.on) return;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state !== 'running') actx.resume();
    const src = actx.createBufferSource();
    src.buffer = actx.createBuffer(1, 1, 22050); src.connect(actx.destination); src.start(0);
  } catch {}
}
// iOS (every browser there is WebKit) only lets audio start inside a user gesture, and a touch
// pointerdown is not one: touchend, pointerup and click are. Try on each until the context runs.
for (const ev of ['pointerup', 'touchend', 'click', 'keydown']) {
  addEventListener(ev, () => { if (!actx || actx.state !== 'running') unlockAudio(); }, true);
}
let noiseBuf = null;
function tone(freq, dur, { type = 'sine', vol = 0.06, slide = 1, at = 0 } = {}) {
  if (!sfx.on || !actx) return;
  const t = actx.currentTime + at, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide !== 1) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function rumble(at, vol, dur) {
  if (!sfx.on || !actx) return;
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 1.5, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = actx.currentTime + at, src = actx.createBufferSource(), lp = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = noiseBuf; lp.type = 'lowpass';
  lp.frequency.setValueAtTime(2400, t); lp.frequency.exponentialRampToValueAtTime(60, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(lp).connect(g).connect(actx.destination); src.start(t); src.stop(t + dur);
}

// Board pass: one full-screen triangle. Every pixel finds its cell, reads that cell's state from a
// storage buffer (state, reveal time, mark time, count) and shades it analytically: bevelled caps lit
// by a moving point light, recessed floors, glyph-atlas numbers, beacons that light their neighbours,
// sonar rings, the blast shockwave and the win wave. Nothing is pre-rendered, so every animation is
// a function of time and the per-cell timestamps the rules write.
const BOARD_WGSL = /* wgsl */`

@group(0) @binding(2) var glyphs: texture_2d<f32>;
@group(0) @binding(3) var samp: sampler;

struct VO { @builtin(position) pos: vec4f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  var o: VO; o.pos = vec4f(p[i], 0.0, 1.0); return o;
}
fn hash2(p: vec2f) -> f32 { return fract(sin(dot(p, vec2f(127.1, 311.7))) * 43758.5453); }
fn sdBox(p: vec2f, b: vec2f, r: f32) -> f32 {
  let q = abs(p) - b + vec2f(r);

}
fn cellAt(c: vec2i) -> vec4f {

  switch n {
    case 1: { return vec3f(0.31, 0.78, 1.0); }
    case 2: { return vec3f(0.38, 0.92, 0.5); }
    case 3: { return vec3f(1.0, 0.43, 0.37); }
    case 4: { return vec3f(0.72, 0.56, 1.0); }
    case 5: { return vec3f(1.0, 0.72, 0.3); }
    case 6: { return vec3f(0.25, 0.9, 0.84); }

// Water caustics for the sea floor around the board.
fn caustic(uv: vec2f, time: f32) -> f32 {

// 0 before the win wave reaches pos, 1 after.
fn winMix(pos: vec2f) -> f32 {

fn tile(p: vec2f, aa: f32) -> vec3f {

    let eps = 0.004;

    let bev = smoothstep(-0.13 * e - 0.001, 0.0, d);

    let dif = max(dot(Nc, Ld), 0.0);

    let spec = pow(max(dot(Nc, H), 0.0), 48.0);

struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f, @location(1) col: vec4f, @location(2) @interpolate(flat) kind: f32 };
@vertex fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VO {

  if (!OFF) { ctx = canvas.getContext('webgpu'); ctx.configure({ device, format, alphaMode: 'opaque' }); }
  const ubuf = device.createBuffer({ size: 13 * 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const sbuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const pbuf = device.createBuffer({ size: PN * PS * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  let cbuf = null, cbufN = 0, atlas = null, atlasSlot = 0, boardBG = null, offTex = null, readBuf = null, reading = false;
  const samp = device.createSampler({ magFilter: 'linear', minFilter: 'linear' });
  const bm = device.createShaderModule({ code: BOARD_WGSL });
  const board = device.createRenderPipeline({ layout: 'auto', vertex: { module: bm, entryPoint: 'vs' },
    fragment: { module: bm, entryPoint: 'fs', targets: [{ format }] }, primitive: { topology: 'triangle-list' } });
  const sim = device.createComputePipeline({ layout: 'auto', compute: { module: device.createShaderModule({ code: SIM_WGSL }), entryPoint: 'sim' } });
  const sm = device.createShaderModule({ code: SPRITE_WGSL });
  const blend = { srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add' };
  const sprites = device.createRenderPipeline({ layout: 'auto', vertex: { module: sm, entryPoint: 'vs' },
    fragment: { module: sm, entryPoint: 'fs', targets: [{ format, blend: { color: blend, alpha: blend } }] } });
  const simBG = device.createBindGroup({ layout: sim.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: pbuf } }, { binding: 1, resource: { buffer: sbuf } }] });
  const spriteBG = device.createBindGroup({ layout: sprites.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: pbuf } }, { binding: 1, resource: { buffer: ubuf } }] });

  // Number glyphs, re-rendered at the board's pixel size so they sample close to 1:1.
  // Red is the glyph, green a blurred copy that becomes its glow.
  function makeAtlas(slot) {
    const W = slot * 9, a = document.createElement('canvas'), b = document.createElement('canvas');
    a.width = b.width = W; a.height = b.height = slot;
    const ca = a.getContext('2d'), cb = b.getContext('2d');
    for (const cx of [ca, cb]) { cx.font = `800 ${Math.round(slot * 0.82)}px "Big Shoulders Display", "Arial Narrow", sans-serif`;
      cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillStyle = '#fff'; }
    cb.shadowColor = '#fff'; cb.shadowBlur = slot * 0.12; cb.shadowOffsetX = W * 2;
    for (let n = 1; n <= 8; n++) {
      const x = (n + 0.5) * slot, y = slot * 0.54;
      ca.fillText(String(n), x, y); cb.fillText(String(n), x - W * 2, y);
    }
    const da = ca.getImageData(0, 0, W, slot).data, db = cb.getImageData(0, 0, W, slot).data;
    const out = new Uint8Array(W * slot * 4);
    for (let i = 0; i < W * slot; i++) { out[i * 4] = da[i * 4 + 3]; out[i * 4 + 1] = Math.min(255, db[i * 4 + 3] * 1.6); out[i * 4 + 3] = 255; }
    const tex = device.createTexture({ size: [W, slot], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });
    device.queue.writeTexture({ texture: tex }, out, { bytesPerRow: W * 4 }, [W, slot]);

  }
  function rebind() {
    boardBG = device.createBindGroup({ layout: board.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: ubuf } }, { binding: 1, resource: { buffer: cbuf } },

  }
  let head = 0;
  function emit(arr) {
    const n = arr.length / PS;
    if (!n) return;
    const first = Math.min(n, PN - head);
    device.queue.writeBuffer(pbuf, head * PS * 4, arr, 0, first * PS);
    if (first < n) device.queue.writeBuffer(pbuf, 0, arr, first * PS, (n - first) * PS);
    head = (head + n) % PN;
  }
  const P = (out, x, y, vx, vy, delay, life, size, kind, r, g, b, a) => out.push(x, y, vx, vy, -delay, life, size, kind, r, g, b, a);
  const cx = i => i % C + 0.5, cy = i => ((i / C) | 0) + 0.5;
  const api = {
    resize() {
      const slot = Math.max(24, Math.min(128, Math.round(cellCss * dpr * 0.85)));
      if (N !== cbufN) {
        cbuf = device.createBuffer({ size: Math.max(N, 1) * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
        cbufN = N; atlasSlot = 0;
      }
      if (slot !== atlasSlot) { atlas = makeAtlas(slot); atlasSlot = slot; }
      rebind();
      if (OFF) {
        const W = canvas.width, H = canvas.height;
        offTex = device.createTexture({ size: [W, H], format, usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
        readBuf = device.createBuffer({ size: Math.ceil(W * 4 / 256) * 256 * H, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
      }
    },
    clearParticles() { device.queue.writeBuffer(pbuf, 0, new Float32Array(PN * PS)); head = 0; },
    dust(out, t0) {
      const arr = [], per = out.length > 160 ? 2 : 4;
      for (const [i, d] of out) for (let k = 0; k < per; k++) {
        const a = fx() * 6.283, s = 0.4 + fx() * 1.6;
        P(arr, cx(i) + (fx() - 0.5) * 0.6, cy(i) + (fx() - 0.5) * 0.6, Math.cos(a) * s, Math.sin(a) * s,
          t0 + d * STEP - now() + 0.05, 0.5 + fx() * 0.4, 0.05 + fx() * 0.05, 4, 0.35, 0.85, 1.0, 0.8);
      }
      emit(new Float32Array(arr));
    },
    plant(i) {
      const arr = [];
      for (let k = 0; k < 16; k++) { const a = k / 16 * 6.283, s = 2 + fx() * 2.5;
        P(arr, cx(i), cy(i), Math.cos(a) * s, Math.sin(a) * s - 1, 0, 0.35 + fx() * 0.2, 0.05, 0, 1.0, 0.5, 0.2, 1); }
      emit(new Float32Array(arr));
    },
    blast(i, delay, big) {
      const arr = [], m = big ? 2.2 : 1;
      for (let k = 0; k < 70 * m; k++) { const a = fx() * 6.283, s = (3 + fx() * 13) * (big ? 1.3 : 1);
        P(arr, cx(i), cy(i), Math.cos(a) * s, Math.sin(a) * s - 3, delay, 0.5 + fx() * 1.0, 0.04 + fx() * 0.05, 0, 1.0, 0.55 + fx() * 0.35, 0.18, 1.3); }
      for (let k = 0; k < 14 * m; k++) { const a = fx() * 6.283, s = 2 + fx() * 7;
        P(arr, cx(i) + (fx() - 0.5) * 0.7, cy(i) + (fx() - 0.5) * 0.7, Math.cos(a) * s, Math.sin(a) * s - 4, delay, 1.2 + fx() * 0.8, 0.07 + fx() * 0.08, 3, 0.11, 0.19, 0.23, 1); }
      for (let k = 0; k < 10 * m; k++) { const a = fx() * 6.283, s = 0.5 + fx() * 1.5;
        P(arr, cx(i), cy(i), Math.cos(a) * s, Math.sin(a) * s, delay + 0.05, 1.4 + fx() * 1.2, 0.35 + fx() * 0.3, 1, 0.05, 0.05, 0.06, 0.8); }
      emit(new Float32Array(arr));
    },
    rise(i, delay) {
      const arr = [];
      for (let k = 0; k < 16; k++) P(arr, cx(i) + (fx() - 0.5) * 0.5, cy(i) + (fx() - 0.5) * 0.5, (fx() - 0.5) * 1.5, -1 - fx() * 3,
        delay + fx() * 0.4, 1.6 + fx() * 1.2, 0.07 + fx() * 0.12, 2, 0.4, 1.0, 0.8, 0.9);
      for (let k = 0; k < 24; k++) { const a = fx() * 6.283, s = 2 + fx() * 6;
        P(arr, cx(i), cy(i), Math.cos(a) * s, Math.sin(a) * s - 4, delay, 0.6 + fx() * 0.6, 0.04, 0, 0.5, 1.0, 0.75, 1); }

    },
    frame(t, dt, U, cellData) {
      if (OFF && reading) return;   // a software adapter can't keep up; let the readback drain the queue
      device.queue.writeBuffer(ubuf, 0, U);

      const cp = enc.beginComputePass(); cp.setPipeline(sim); cp.setBindGroup(0, simBG); cp.dispatchWorkgroups(PN / 64); cp.end();
      const view = OFF ? offTex.createView() : ctx.getCurrentTexture().createView();
      const rp = enc.beginRenderPass({ colorAttachments: [{ view, loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
      rp.setPipeline(board); rp.setBindGroup(0, boardBG); rp.draw(3);
      rp.setPipeline(sprites); rp.setBindGroup(0, spriteBG); rp.draw(6, PN);
      rp.end();

      // that lose any device presenting to a canvas.

      const read = OFF;
      if (read) enc.copyTextureToBuffer({ texture: offTex }, { buffer: readBuf, bytesPerRow: bpr }, [W, H]);
      device.queue.submit([enc.finish()]);

}
function useFallback() { $('gl').hidden = true; $('c2').hidden = false; $('nogpu').hidden = false; }

/* ---------- plain 2D view, when WebGPU is missing ---------- */
const NUMC = ['', '#4fc7ff', '#61eb80', '#ff6e5e', '#b88fff', '#ffb84d', '#40e6d6', '#f5f2e6', '#9eadbd'];
function draw2d(t) {
  const cv = $('c2'), g = cv.getContext('2d');
  g.fillStyle = '#06121a'; g.fillRect(0, 0, cv.width, cv.height);
  paintBoard(g, orgCss[0] * dpr, orgCss[1] * dpr, cellCss * dpr, dpr, t);
}
// The board at cell size s from (ox, oy); u is one CSS pixel. The share card draws it too.
function paintBoard(g, ox, oy, s, u, t) {
  g.fillStyle = '#0b161c'; g.fillRect(ox - 4 * u, oy - 4 * u, C * s + 8 * u, R * s + 8 * u);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `800 ${Math.round(s * 0.72)}px "Big Shoulders Display", sans-serif`;
  for (let i = 0; i < N; i++) {
    const x = ox + (i % C) * s, y = oy + ((i / C) | 0) * s, open = state[i] === OPEN && t >= revealT[i];
    if (open) {
      g.fillStyle = i === hitIdx ? '#6b0a07' : '#08141a'; g.fillRect(x, y, s, s);
      if (mine[i]) { g.fillStyle = '#c9c9cf'; g.beginPath(); g.arc(x + s / 2, y + s / 2, s * 0.2, 0, 7); g.fill(); }
      else if (count[i]) { g.fillStyle = NUMC[count[i]]; g.fillText(String(count[i]), x + s / 2, y + s * 0.54); }
    } else {
      g.fillStyle = '#1b2f38'; g.fillRect(x + 1, y + 1, s - 2, s - 2);
      g.fillStyle = '#2a4552'; g.fillRect(x + 1, y + 1, s - 2, 2 * u);
      if (state[i] === FLAG && t >= flagT[i]) {
        g.fillStyle = status === 'won' ? '#4dffb3' : '#ff6a3a'; g.beginPath(); g.arc(x + s / 2, y + s / 2, s * 0.15, 0, 7); g.fill();
        if (status === 'lost' && !mine[i]) { g.strokeStyle = '#ff4030'; g.lineWidth = 2 * u; g.beginPath();
          g.moveTo(x + s * 0.25, y + s * 0.25); g.lineTo(x + s * 0.75, y + s * 0.75); g.moveTo(x + s * 0.75, y + s * 0.25); g.lineTo(x + s * 0.25, y + s * 0.75); g.stroke(); }
      }
    }
  }
}

/* ---------- share card ---------- */
// A PNG of the finished board, the result and the game's address. It is built when the end card shows,
// so the tap on SHARE can call navigator.share at once: iOS refuses it after an await.
const SHARE_URL = 'austegard.com/fun-and-games/sounding/';
let shareFile = null;
function buildShare() {
  shareFile = null; $('shareBtn').disabled = true;
  const won = status === 'won', s = Math.floor(Math.min(960 / C, 1000 / R)), bw = C * s, bh = R * s;
  const W = 1080, H = 330 + bh + 160, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d'), disp = '"Big Shoulders Display", "Arial Narrow", sans-serif', mono = '"IBM Plex Mono", ui-monospace, monospace';
  g.fillStyle = '#06121a'; g.fillRect(0, 0, W, H);
  g.textBaseline = 'alphabetic'; g.textAlign = 'left'; g.letterSpacing = '10px';
  g.fillStyle = '#5fd4f0'; g.font = `800 40px ${disp}`; g.fillText('SOUNDING', 60, 100);
  g.letterSpacing = '0px'; g.textAlign = 'right'; g.fillStyle = '#7f9ea8'; g.font = `400 28px ${mono}`;
  g.fillText(`${C}×${R} · ${M} mines`, W - 60, 100);
  g.textAlign = 'left'; g.fillStyle = won ? '#6ff0c0' : '#ff7a4a'; g.font = `800 92px ${disp}`;
  g.fillText($('ovTitle').textContent, 56, 205, W - 112);
  g.fillStyle = '#eef2e2'; g.font = `400 32px ${mono}`;
  g.fillText((won ? '' : `${fmt(endT - startT)} s · `) + $('ovBody').textContent, 60, 262, W - 120);
  paintBoard(g, (W - bw) / 2, 320, s, 2, Infinity);
  g.textAlign = 'center'; g.fillStyle = '#7f9ea8'; g.font = `600 34px ${mono}`;
  g.fillText(SHARE_URL, W / 2, H - 62);
  cv.toBlob(b => { if (b) { shareFile = new File([b], 'sounding.png', { type: 'image/png' }); $('shareBtn').disabled = false; } }, 'image/png');
}
function share() {
  if (!shareFile) return;
  const secs = fmt(endT - startT);
  const text = `Sounding: ${$('ovTitle').textContent.toLowerCase()} ${status === 'won' ? 'in' : 'after'} ${secs} s on ${C}×${R}. https://${SHARE_URL}`;
  if (navigator.canShare && navigator.canShare({ files: [shareFile] })) {
    navigator.share({ files: [shareFile], text }).catch(e => { if (e.name !== 'AbortError') saveShare(); });
  } else saveShare();
}
function saveShare() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(shareFile); a.download = shareFile.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- frame loop ---------- */
const U = new Float32Array(13 * 4);
let cellData = new Float32Array(0), lastT = now(), lit = null;
function frame() {
  const t = now(), dt = Math.min(t - lastT, 1 / 30); lastT = t;
  tickClock();
  if (gpu) {
    // The light follows the pointer, and drifts round the board when there is none.
    const idle = [C / 2 + Math.cos(t * 0.23) * C * 0.42, R / 2 + Math.sin(t * 0.31) * R * 0.42];
    const goal = light || idle;
    lit = lit || goal.slice();
    lit[0] += (goal[0] - lit[0]) * Math.min(1, dt * 6); lit[1] += (goal[1] - lit[1]) * Math.min(1, dt * 6);
    let shake = 0;
    for (const [dt0, amp] of dets) { const a = t - dt0; if (a >= 0 && a < 0.8) shake += amp * Math.exp(-a * 9); }
    shake = Math.min(shake, 18) * dpr;
    const W = $('gl').width, H = $('gl').height;
    U.fill(0);
    U.set([W, H, orgCss[0] * dpr + (fx() - 0.5) * shake, orgCss[1] * dpr + (fx() - 0.5) * shake], 0);
    U.set([cellCss * dpr, t, C, R], 4);
    U.set([lit[0], lit[1], hover[0], hover[1]], 8);
    U.set([endT, endKind, boom[0], boom[1]], 12);
    pings.forEach((p, k) => U.set(p, 16 + k * 4));
    U.set([flagMode ? 1 : 0, dpr, Math.max(C, R) * 0.32, 0], 48);
    if (cellData.length !== N * 4) cellData = new Float32Array(N * 4);
    for (let i = 0; i < N; i++) {
      const o = i * 4;
      cellData[o] = state[i]; cellData[o + 1] = revealT[i]; cellData[o + 2] = flagT[i];
      cellData[o + 3] = mine[i] ? (i === hitIdx ? 10 : 9) : count[i];
    }
    gpu.frame(t, dt, U, cellData);
  } else draw2d(t);
  requestAnimationFrame(frame);
}

if (DEBUG) {
  window.__sounding = {
    state: () => ({ status, C, R, M, opened, flagged, renderer: gpu ? 'webgpu' : '2d', level }),
    cell: (x, y) => { const i = y * C + x; return { state: state[i], mine: mine[i], count: count[i] }; },
    setMines(list) {
      mine.fill(0); for (const [x, y] of list) mine[y * C + x] = 1;
      M = list.length; setCounts(); status = 'play'; startT = now(); hud();
    },
    reveal: (x, y) => reveal(y * C + x), flag: (x, y) => toggleFlag(y * C + x), chord: (x, y) => chord(y * C + x),
    newGame, layout: () => ({ cellCss, orgCss, dpr }),
  };
}

(async () => {
  try { await Promise.race([document.fonts.load('800 64px "Big Shoulders Display"'), new Promise(r => setTimeout(r, 1500))]); } catch {}
  gpu = await initGPU();
  if (!gpu || OFF) { useFallback(); if (OFF && gpu) $('nogpu').hidden = true; }
  newGame(level);
  requestAnimationFrame(frame);
})();
/* Updates, as in Plumb: a home-screen app usually resumes rather than reloads, so ask the service worker
   to check on every return to the foreground and every 30 minutes, and reload into a new version only
   while no game is in progress. */
let updateReady = false, swReg = null;
function applyUpdate() { if (updateReady && status !== 'play') location.reload(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && swReg) swReg.update().catch(() => {}); });
if ('serviceWorker' in navigator && isSecureContext && location.hostname !== 'localhost') {
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) { hadController = true; return; }
    updateReady = true; applyUpdate();
  });
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(r => { swReg = r; setInterval(() => r.update().catch(() => {}), 30 * 60 * 1000); })
      .catch(() => {});
  });
}
})();
</script>
