<script type="x-shader/x-fragment" id="apo-frag">#version 300 es
precision highp float;
/* Apollonian gasket, band model. Each pixel is folded into the fundamental strip and inverted in the
   dual circles until it lands in a disk (C0 or the half-plane y<0) or its structure is below a pixel.
   Along the way it carries: s = |dz/dp| (and the complex derivative J), and the image of the screen's
   point at infinity (n/d), which together give the exact screen radius of the disk it lands in. */
uniform vec2 uA, uB, uC, uD;   // camera z = (a q + b)/(c q + d) in device px, y down, centred
uniform float uF;              // 1: q = conj(p)
uniform vec2 uDet;             // det of the camera (unit modulus)
uniform vec2 uRes;
uniform float uLz, uDpr, uLogS;
uniform vec3 uPal[7];
out vec4 outColor;

const int MAXIT = 240;
const vec3 BG = vec3(0.027, 0.031, 0.051);

vec2 cmul(vec2 a, vec2 b) { return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
vec2 cdiv(vec2 a, vec2 b) { float q = dot(b, b); return vec2(a.x * b.x + a.y * b.y, a.y * b.x - a.x * b.y) / q; }
vec2 cj(vec2 a) { return vec2(a.x, -a.y); }

vec3 pal(float t) {
  t = fract(t) * 7.0;
  float i = floor(t), u = t - i;
  u = u * u * (3.0 - 2.0 * u);
  int k = int(i);
  int k2 = k == 6 ? 0 : k + 1;
  return mix(uPal[k], uPal[k2], u);
}
float hueFor(float rCss) { return 0.17 * (log2(max(rCss, 1e-30)) - uLz - uLogS) + 0.99; }
vec3 dust(float h) { return pal(h) * 0.26 + pal(h + 0.12) * 0.10; }

void main() {
  vec2 p = vec2(gl_FragCoord.x - 0.5 * uRes.x, 0.5 * uRes.y - gl_FragCoord.y);
  vec2 q = uF > 0.5 ? cj(p) : p;
  vec2 den = cmul(uC, q) + uD;
  vec2 z = cdiv(cmul(uA, q) + uB, den);
  float s = 1.0 / dot(den, den);
  vec2 J = cdiv(uDet, cmul(den, den));
  float par = uF;
  vec2 n = uA, d = uC;
  int kind = 3;
  for (int i = 0; i < MAXIT; i++) {
    float k = floor((z.x + 1.0) * 0.5);
    if (k != 0.0) { z.x -= 2.0 * k; n -= 2.0 * k * d; }
    if (z.y > 1.0) {
      z.y = 2.0 - z.y;
      n = cj(n) + cmul(vec2(0.0, 2.0), cj(d)); d = cj(d);
      J = cj(J); par = 1.0 - par;
    }
    if (z.y < 0.0) { kind = 1; break; }
    if (z.x * z.x + (z.y - 1.0) * (z.y - 1.0) < 1.0) { kind = 0; break; }
    if (s > 2.8) { kind = 2; break; }
    float o = z.x >= 0.0 ? 1.0 : -1.0;
    vec2 w = z - vec2(o, 0.0);
    float r2 = dot(w, w);
    z = vec2(o, 0.0) + w / r2;
    s /= r2;
    vec2 cw = cj(w);
    J = -cdiv(cj(J), cmul(cw, cw)); par = 1.0 - par;
    vec2 nn = o * cj(n), dd = cj(n) - o * cj(d);
    float m = max(max(abs(nn.x), abs(nn.y)), max(abs(dd.x), abs(dd.y)));
    n = nn / m; d = dd / m;
  }

  vec3 col;
  if (kind <= 1) {
    float Qz, Qh; vec2 Ns, Ds;
    vec2 nd = cmul(n, cj(d));
    if (kind == 0) {
      Qz = dot(z, z) - 2.0 * z.y; Qh = dot(n, n) - 2.0 * nd.y;
      Ds = cj(n - cmul(vec2(0.0, 1.0), d)); Ns = cmul(vec2(0.0, 1.0), Ds) + cj(d);
    } else { Qz = 2.0 * z.y; Qh = 2.0 * nd.y; Ns = cj(n); Ds = cj(d); }
    vec2 diff = cmul(z, d) - n;
    float rs = dot(diff, diff) / (s * abs(Qh) + 1e-30);      // screen radius, device px
    float sig = Qh >= 0.0 ? 1.0 : -1.0;
    float t = Qz * sig / (s * rs);
    float rho = sqrt(max(0.0, 1.0 + t));                     // |p - centre| / radius
    float e = -Qz / (s * (1.0 + rho));                       // distance to the rim, device px
    // direction from the circle's centre m: q - m = (z D* - N*)(z d - n) / (J (N* d - n D*)), with N*/D*
    // the reflection of screen infinity's image n/d in the canonical circle
    vec2 v = cdiv(cmul(cmul(z, Ds) - Ns, cmul(z, d) - n), cmul(J, cmul(Ns, d) - cmul(n, Ds)));
    if (par > 0.5) v = cj(v);
    vec2 nrm = v / max(length(v), 1e-30);
    float rCss = rs / uDpr, eCss = e / uDpr;
    float h = hueFor(rCss);
    vec3 base = pal(h), film = pal(h + 0.13);
    if (sig > 0.0) {
      // bubble: dark tinted body, bright rim, soft inner glow, a highlight on the larger ones
      vec3 body = base * (0.030 + 0.10 * pow(rho, 8.0) / (1.0 + rCss / 3000.0));
      float line = exp(-eCss / 0.75);
      float glow = exp(-eCss / (1.2 + 0.07 * rCss / (1.0 + rCss / 500.0)));
      vec3 N = vec3(rho * nrm, sqrt(max(0.0, 1.0 - rho * rho)));
      vec3 L = normalize(vec3(-0.45, -0.6, 0.66));
      float spec = pow(max(0.0, dot(reflect(-L, N), vec3(0.0, 0.0, 1.0))), 48.0);
      float big = smoothstep(6.0, 30.0, rCss);
      col = body + film * glow * 0.42 + mix(film, vec3(1.0), 0.28) * line * 0.9
          + vec3(0.9, 0.95, 1.0) * spec * 0.22 * big;
      col = mix(dust(h), col, smoothstep(0.7, 3.2, rCss));
    } else {
      // outside the outermost circle
      float line = exp(-eCss / 0.75);
      float glow = exp(-eCss / (2.0 + 0.035 * rCss / (1.0 + rCss / 800.0)));
      col = BG + mix(film, vec3(1.0), 0.25) * line * 0.8 + film * glow * 0.22;
    }
  } else {
    col = dust(hueFor(0.35 / (s * uDpr)));
  }
  col = col / (1.0 + 0.3 * col) * 1.15;
  float dither = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
  outColor = vec4(col + dither / 255.0, 1.0);
}</script>
<script type="x-shader/x-fragment" id="jul-frag">#version 300 es
precision highp float;
/* Julia set f(z) = z^2 + c through a renormalised chart: pixel p sits at uC + uA p on level uM (the
   chart already includes uM applications of f). The first steps run as perturbations of the chart
   centre's orbit (uRef), because the pixel offsets are far below float precision next to |uC|; once
   the offset has grown they continue directly. */
uniform vec2 uC, uA, uJc;
uniform vec2 uRef[64];
uniform int uRefN, uPeriod;
uniform vec2 uRes;
uniform float uM, uLz, uDpr;
uniform vec3 uPal[7];
out vec4 outColor;

const int MAXIT = 900;
const vec3 BG = vec3(0.027, 0.031, 0.051);

vec2 cmul(vec2 a, vec2 b) { return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
vec3 pal(float t) {
  t = fract(t) * 7.0;
  float i = floor(t), u = t - i;
  u = u * u * (3.0 - 2.0 * u);
  int k = int(i);
  int k2 = k == 6 ? 0 : k + 1;
  return mix(uPal[k], uPal[k2], u);
}

void main() {
  vec2 p = vec2(gl_FragCoord.x - 0.5 * uRes.x, 0.5 * uRes.y - gl_FragCoord.y);
  vec2 dl = cmul(uA, p), D = uA;
  int n = 0;
  for (int i = 0; i < 63; i++) {
    if (i >= uRefN - 1) break;
    vec2 Cn = uRef[i];
    if (dot(dl, dl) > 1e-6 * max(dot(Cn, Cn), 1e-4)) break;
    D = 2.0 * cmul(Cn + dl, D);
    dl = 2.0 * cmul(Cn, dl) + cmul(dl, dl);
    n++;
  }
  vec2 z = uRef[n] + dl, zs = z;
  int state = 0;                         // 0 undecided, 1 escaped, 2 on the set, 3 captured
  for (int i = 0; i < MAXIT; i++) {
    float r2 = dot(z, z);
    if (r2 > 1e6) { state = 1; break; }
    if (dot(D, D) > 1e24) { state = 2; break; }
    D = 2.0 * cmul(z, D);
    z = cmul(z, z) + uJc;
    n++;
    if (uPeriod > 0 && n % uPeriod == 0) {
      vec2 dd = z - zs;
      if (dot(dd, dd) < 1e-9) { state = 3; break; }
      zs = z;
    }
  }
  vec3 col;
  float lev = uM + float(n);
  if (state == 1) {
    float r = length(z);
    float nu = lev + 1.0 - log2(log(r) / log(1000.0));
    float de = r * log(r) / length(D) / uDpr;     // distance to the set, CSS px
    float h = 0.013 * nu + 0.55;
    vec3 c1 = pal(h), c2 = pal(h + 0.14);
    float core = exp(-de / 0.8), halo = exp(-de / 7.0), wide = exp(-de / 60.0);
    col = BG + c1 * (0.05 + 0.08 * wide) + c2 * halo * 0.5 + mix(c2, vec3(1.0), 0.45) * core * 0.85;
  } else if (state == 2 || state == 0) {
    float h = 0.013 * lev + 0.55;
    col = BG + mix(pal(h + 0.14), vec3(1.0), 0.45) * 0.85 + pal(h + 0.14) * 0.5;
  } else {
    float h = 0.013 * lev + 0.55;
    col = BG + pal(h + 0.4) * 0.035;
  }
  col = col / (1.0 + 0.3 * col) * 1.15;
  float dither = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
  outColor = vec4(col + dither / 255.0, 1.0);
}</script>
<script>/* Shared complex arithmetic, and the Bubbles camera geometry (doubles).
 *
 * Band model of the gasket: half-planes y<0 and y>2 plus unit circles centred (2n, 1). The pixel
 * algorithm folds x into [-1,1), reflects y>1 to 2-y, stops in C0 (centre i, r 1) or y<0, otherwise
 * inverts in the unit circle centred (sign x, 0). Every one of those maps is a symmetry of the gasket,
 * so the camera (a Möbius or anti-Möbius map from screen to plane) can absorb any of them without the
 * picture changing. Colours come only from exact screen-space circle geometry, so they do not change
 * either. */
'use strict';

/* ---- complex helpers on [re, im] ---- */
function cm(a, b) { return [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]]; }
function ca(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
function cs(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
function cc(a) { return [a[0], -a[1]]; }
function cr(a, k) { return [a[0] * k, a[1] * k]; }
function cd(a, b) { var q = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / q, (a[1] * b[0] - a[0] * b[1]) / q]; }
function cabs2(a) { return a[0] * a[0] + a[1] * a[1]; }

/* ---- camera: z = (a q + b) / (c q + d), q = f ? conj(p) : p ---- */
function mobApply(T, p) { var q = T.f ? cc(p) : p; return cd(ca(cm(T.a, q), T.b), ca(cm(T.c, q), T.d)); }
/* |det| is kept at exactly 1 and its phase tracked (T.dp), so nothing ever recomputes ad - bc, which
   cancels catastrophically when the entries are large. */
function mobDet(T) { return T.dp; }
function mobDeriv(T, p) { var q = T.f ? cc(p) : p; return 1 / cabs2(ca(cm(T.c, q), T.d)); }
function mobInv(T, z) {
  var q = cd(cs(cm(T.d, z), T.b), cs(T.a, cm(T.c, z)));
  return T.f ? cc(q) : q;
}
function mobScale(T, s) { return { a: cr(T.a, s), b: cr(T.b, s), c: cr(T.c, s), d: cr(T.d, s), f: T.f, dp: T.dp }; }
/* Build a camera from raw entries, computing the determinant once (only for well-conditioned input). */
function mobMake(a, b, c, d, f) {
  var det = cs(cm(a, d), cm(b, c)), m = Math.sqrt(cabs2(det)), s = 1 / Math.sqrt(m);
  return { a: cr(a, s), b: cr(b, s), c: cr(c, s), d: cr(d, s), f: f, dp: cr(det, 1 / m) };
}
/* T <- T o (p -> k p + t), k real */
function camAffine(T, k, t) {
  var tt = T.f ? cc(t) : t, s = 1 / Math.sqrt(k);   // det scales by k (real, > 0)
  return mobScale({ a: cr(T.a, k), b: ca(cm(T.a, tt), T.b), c: cr(T.c, k), d: ca(cm(T.c, tt), T.d), f: T.f, dp: T.dp }, s);
}
/* T <- op o T. op: ['t', tau] z+tau (tau real) ; ['r'] z -> conj z + 2i ; ['i', o] z -> o + 1/conj(z - o) */
function camOp(T, op) {
  if (op[0] === 't') {
    var t = [op[1], 0];
    return { a: ca(T.a, cm(t, T.c)), b: ca(T.b, cm(t, T.d)), c: T.c, d: T.d, f: T.f, dp: T.dp };
  }
  if (op[0] === 'r') {
    var i2 = [0, 2];
    return { a: ca(cc(T.a), cm(i2, cc(T.c))), b: ca(cc(T.b), cm(i2, cc(T.d))), c: cc(T.c), d: cc(T.d), f: 1 - T.f, dp: cc(T.dp) };
  }
  var o = op[1];
  return { a: cr(cc(T.a), o), b: cr(cc(T.b), o), c: cs(cc(T.a), cr(cc(T.c), o)),
    d: cs(cc(T.b), cr(cc(T.d), o)), f: 1 - T.f, dp: cr(cc(T.dp), -1) };
}
function opInverse(op) { return op[0] === 't' ? ['t', -op[1]] : op; }
function pointOp(z, op) {
  if (op[0] === 't') return [z[0] + op[1], z[1]];
  if (op[0] === 'r') return [z[0], 2 - z[1]];
  var w = [z[0] - op[1], z[1]], r2 = cabs2(w);
  return [op[1] + w[0] / r2, w[1] / r2];
}
/* The next symmetry that canonicalises point z, or null if none magnifies it. */
function nextOp(z) {
  var x = z[0], y = z[1];
  if (x < -1 || x >= 1) return ['t', -2 * Math.floor((x + 1) / 2)];
  if (y > 1) return ['r'];
  var o = x >= 0 ? 1 : -1, r2 = (x - o) * (x - o) + y * y;
  if (r2 < 1 - 1e-12) return ['i', o];
  return null;
}

/* ---- generalized circles in ACC coordinates {A, C, B:[re,im]}: A|z|^2 - 2Re(conj(B) z) + C = 0,
   normalised |B|^2 - AC = 1; negative inside. A = curvature, B/A = centre. ---- */
function accOp(v, op) {
  if (op[0] === 't') { // map z -> z + t
    var t = [op[1], 0];
    return { A: v.A, B: ca(v.B, cr(t, v.A)), C: v.A * cabs2(t) + 2 * (v.B[0] * t[0] + v.B[1] * t[1]) + v.C };
  }
  if (op[0] === 'r') { // conj, then +2i
    var w = { A: v.A, B: cc(v.B), C: v.C }, t2 = [0, 2];
    return { A: w.A, B: ca(w.B, cr(t2, w.A)), C: w.A * 4 + 2 * (w.B[0] * t2[0] + w.B[1] * t2[1]) + w.C };
  }
  var o = op[1];
  var u = accOp(v, ['t', -o]);
  u = { A: u.C, B: u.B, C: u.A };
  return accOp(u, ['t', o]);
}
function accAdd(vs, ws) { // linear combination: sum k_i v_i
  var A = 0, C = 0, B = [0, 0];
  for (var i = 0; i < vs.length; i++) { A += ws[i] * vs[i].A; C += ws[i] * vs[i].C; B = ca(B, cr(vs[i].B, ws[i])); }
  return { A: A, B: B, C: C };
}
var L0 = { A: 0, B: [0, -1], C: 0 }, L2 = { A: 0, B: [0, 1], C: 4 };
var C0 = { A: 1, B: [0, 1], C: 0 };
function Cn(n) { return accOp(C0, ['t', 2 * n]); }

</script>
<script>/* Bubbles camera: screen (CSS px, centred, y down) -> band-model plane, kept well conditioned by
 * absorbing gasket symmetries (renorm) and switching back to saved representations on the way out. */
var APO = (function () {
  'use strict';
  var GOOD = 12, MAXSEQ = 4096;

  function homeCamera(S) {
    var P = function (k) { var t = -Math.PI / 2 + 2 * Math.PI * k / 3; return [Math.cos(t), Math.sin(t)]; };
    var P1 = P(0), P2 = P(2), P3 = P(1);
    var H1 = { a: cs(P3, P1), b: cr(cm(P2, cs(P3, P1)), -1), c: cs(P3, P2), d: cr(cm(P1, cs(P3, P2)), -1) };
    var T = { a: ca(cr(H1.a, 2), cm([0, 2], H1.c)), b: ca(cr(H1.b, 2), cm([0, 2], H1.d)), c: H1.c, d: H1.d, f: 0 };
    return mobMake(cr(T.a, 1 / S), T.b, cr(T.c, 1 / S), T.d, 0);
  }

  function State(S, Rv) {
    this.S = S; this.Rv = Rv; this.home(S);
  }
  State.prototype.home = function (S) {
    this.T = homeCamera(S || this.S); this.Lz = 0; this.quad = null;
    this.snaps = [{ T: this.T, d: 0, s: 1, t: [0, 0] }];
  };
  State.prototype.rho = function (T) { return mobDeriv(T || this.T, [0, 0]) * this.Rv; };
  State.prototype.applyOp = function (op) {
    this.T = camOp(this.T, op);
    if (this.quad) for (var i = 0; i < 4; i++) this.quad[i] = accOp(this.quad[i], op);
  };
  /* Conditioning of the camera on the screen disk: ||T||^2 with |det| = 1 and the disk scaled to
     radius 1. It is a hyperbolic distance in disguise, it bounds the float32 error of evaluating T in
     the shader (about 4e-8 * N * Rv pixels), and it is smallest when the view is about one canonical
     unit across and near the origin. */
  State.prototype.cond = function (T) {
    T = T || this.T;
    var R = this.Rv;
    return (R * R * (cabs2(T.a) + cabs2(T.c)) + cabs2(T.b) + cabs2(T.d)) / R;
  };
  /* Screen-space camera moves. Every snapshot keeps the affine map from the current screen to its own
     screen, so its representation of the current view can be rebuilt without going through T. */
  State.prototype.screenAffine = function (k, t) {
    this.T = camAffine(this.T, k, t);
    for (var i = 0; i < this.snaps.length; i++) {
      var S = this.snaps[i];
      S.t = [S.s * t[0] + S.t[0], S.s * t[1] + S.t[1]]; S.s *= k;
    }
  };
  State.prototype.zoom = function (dz, a) {
    var k = Math.pow(2, -dz);
    this.screenAffine(k, cr(a, 1 - k));
    this.Lz += dz;
  };
  State.prototype.pan = function (dx, dy) { this.screenAffine(1, [-dx, -dy]); };
  State.prototype.toScreen = function (z) { return mobInv(this.T, z); };
  State.prototype.snapshot = function () {
    var sn = this.snaps, last = sn[sn.length - 1];
    var rec = { T: this.T, d: this.Lz, s: 1, t: [0, 0] };
    if (last && last.d > 0 && Math.abs(last.d - this.Lz) < 0.5 && sn.length > 1) sn[sn.length - 1] = rec; else sn.push(rec);
  };

<script>/* Julia camera: the view is a linear chart w = C + A p at "level" m, meaning it shows f^m of the true

      var a = 1 - Math.exp(-(auto.rate * dt / 0.3 + dt / 3));   // pan measured in octaves travelled
      panBy(-sp[0] * a, -sp[1] * a);
      zoomBy(auto.rate * dt, [0, 0]);
    }
    if (pend.dz || pend.px || pend.py) {
      var b = 1 - Math.exp(-dt / 0.09);
      var dz = pend.dz * b, px = pend.px * b, py = pend.py * b;
      if (Math.abs(pend.dz) < 1e-4) dz = pend.dz;
      pend.dz -= dz; pend.px -= px; pend.py -= py;
      if (Math.abs(pend.px) < 0.05) { px += pend.px; pend.px = 0; }
      if (Math.abs(pend.py) < 0.05) { py += pend.py; pend.py = 0; }
      if (px || py) panBy(px, py);
      if (dz) zoomBy(dz, [pend.ax, pend.ay]);
    }
    if (dirty) {
      st.renorm();
      draw();
      dirty = false;
      // adapt resolution to keep frames smooth while moving
      ft = ft * 0.9 + (dt * 1000) * 0.1;
      if (ft > 24 && scale > 0.5) { if (++slowFrames > 20) { scale = Math.max(0.5, scale * 0.85); resize(); slowFrames = 0; ft = 16; } } else slowFrames = 0;
      if (ft < 13 && scale < maxScale) { if (++fastFrames > 90) { scale = Math.min(maxScale, scale * 1.15); resize(); fastFrames = 0; } } else fastFrames = 0;
    }
    if (ts - hudT > 100) { hudT = ts; elDepth.innerHTML = depthText(); }
  }
  requestAnimationFrame(tick);
  setMode(mode);
  elHint.classList.add('show');
  setTimeout(function () { if (!auto.on) hideHint(); }, 7000);

  window.__fd = {
    st: st, setMode: function (m) { setMode(m); }, setAuto: setAuto, draw: function () { st.renorm(); draw(); },
    info: function () { return { mode: mode, Lz: st.Lz, N: mode === 'julia' ? st.viewR() : st.cond(), m: st.m, snaps: st.snaps ? st.snaps.length : st.stack.length, auto: auto.on, scale: scale, w: canvas.width, h: canvas.height }; }
  };
})();
</script>
